        desc: 该参数用于控制系统发布用户wlr_ud网段路由掩码长度。 该参数配置为N，代表发布用户wlr_ud路由覆盖的地址个数为2的N次方（2^N）。
          如果地址段内的地址个数小于2的N次方（2^N），则按照原有规则生成路由。 改变系统发布用户wlr_ud网段路由掩码长度会对系统信令处理能力
  ADD SRROUTE:
