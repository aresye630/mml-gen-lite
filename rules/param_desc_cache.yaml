        desc: 禁止OSPF进程下所有接口收发OSPF报文标志。
      BFDALLINTFFLG:
        name: 使能BFD
        desc: 配置OSPF进程下使能BFD特性。
      BFDRXCFGFLAG:
        name: 是否配置BFD最小接收报文间隔
        desc: 是否配置BFD最小接收报文间隔。
      BFDMINRXINTV:
        name: 接收BFD包的最小时间间隔（ms）
        desc: 期望从对端接收BFD报文的最小接收间隔。
      BFDTXCFGFLAG:
        name: 是否配置BFD最小发送报文间隔
        desc: 是否配置BFD最小发送报文间隔。
      BFDMINTXINTV:
        name: 发送BFD包的最小时间间隔（ms）
        desc: 向对端发送BFD报文的最小发送间隔。
      SCHEMABFDDETMUL:
        name: BFD检测乘数
        desc: 该参数用于指定会话检测倍数，如果BFD会话在设置的检测周期内没有收到对端发来的BFD报文，则认为链路发生了故障，BFD会话的状态将会置为Down。
      FRRBINDINGFLAG:
        name: BFD会话与接口链路状态绑定标志
        desc: 是否将BFD会话状态与接口的链路状态进行绑定。
      RFC1583COMPFLG:
        name: 兼容RFC1583
        desc: 使能兼容RFC1583的路由选择优先规则。
      ROUTAGFLAG:
        name: 配置VPN引入路由的tag值
        desc: 配置VPN引入路由的tag值。
      ROUTAG:
        name: VPN引入路由的tag值
        desc: 标识VPN引入路由的tag值。
      BANDWIDTHREF:
        name: 计算链路开销参考值（Mbps）
        desc: 计算链路开销时所依据的参考值。
      RXMTLIMITENABLE:
        name: 使能最大重传数
        desc: 标志是否使能最大重传限制数。
      RETRANSLIMIT:
        name: 最大重传限制
        desc: 最大重传限制数。
      OPAQCAPFLG:
        name: Opaque LSA能力
        desc: 使能Opaque-LSA能力，从而OSPF进程可以生成Opaque LSA，并能从邻居设备接收Opaque LSA。
      DESCRIPTIONTEXT:
        name: 描述信息
        desc: OSPF进程的描述信息。
      LSAARRINTVFLAG:
        name: 取消使用智能定时器配置LSA接收的间隔时间
        desc: 取消使用智能定时器配置LSA接收的间隔时间。
      LSAARRINTV:
        name: 接收时间间隔（ms）
        desc: LSA被接收的时间间隔。
      LSAARRMAXINTV:
        name: 接收最长间隔时间（ms）
        desc: 接收OSPF LSA的最长间隔时间。
      LSAARRSTARINTV:
        name: 接收初始间隔时间（ms）
        desc: 接收OSPF LSA的初始间隔时间。
      LSAARRHLDINTV:
        name: 接收基数间隔时间（ms）
        desc: 接收OSPF LSA的基数间隔时间。
      LSAORIGINSTFLAG:
        name: 是否指定LSA更新的时间间隔为0
        desc: 是否指定LSA更新的时间间隔为0，即取消LSA的5秒的更新时间间隔。
      LSAORIGINTV:
        name: 更新时间间隔（s）
        desc: 指定设置除OSPF Router LSA和Network LSA外LSA的更新间隔时间。
      LSAORIGMAXINTV:
        name: 更新最长间隔时间（ms）
        desc: 更新Router LSA和Network LSA的最长间隔时间。
      LSAORIGSTARINTV:
        name: 更新初始间隔时间（ms）
        desc: 更新Router LSA和Network LSA的初始间隔时间。
      LSAORIGHLDINTV:
        name: 更新基数间隔时间（ms）
        desc: 更新Router LSA和Network LSA的基数间隔时间。
      VPNINSCAPSIMFLG:
        name: 去使能VPN路由环路检测
        desc: 禁止路由环路检测，直接进行路由计算。当在MCE（Multi-VPN-Instance CE）路由器上支持VPN多实例时，需要取消环路检查。
      STUBROUFLG:
        name: Stub路由器
        desc: 配置Stub路由器。
      STUBROUSTUPINTV:
        name: On-Startup时间间隔（s）
        desc: 路由器在发生主备倒换过程中保持为Stub路由器的时间间隔。
      STUBROUINCSTUB:
        name: 是否为Stub链路发布最大开销值
        desc: 指定设备为Router LSA中的stub链路设置最大开销65535。
      SAFESYNCFLG:
        name: 安全同步
        desc: 配置安全同步。
      SPFINTVSEC:
        name: SPF计算间隔时间（s）
        desc: OSPF的SPF（最短路径优先）计算间隔时间。通过调节SPF的计算间隔，可以抑制网络频繁变化可能导致的占用过多带宽资源和路由器资源。
      SPFINTVMILLISEC:
        name: SPF计算间隔时间（ms）
        desc: OSPF的SPF计算间隔时间。通过调节SPF的计算间隔，可以抑制网络频繁变化可能导致的占用过多带宽资源和路由器资源。
      SPFMAXINTERVAL:
        name: SPF计算最长间隔时间（ms）
        desc: 通过智能定时器设置OSPF SPF计算的最长间隔时间。通过调节SPF的计算间隔，可以抑制网络频繁变化可能导致的占用过多带宽资源和路由器资源。
      SPFSTARTINTV:
        name: SPF计算初始间隔时间（ms）
        desc: 指定通过智能定时器设置OSPF SPF计算的初始间隔时间。通过调节SPF的计算间隔，可以抑制网络频繁变化可能导致的占用过多带宽资源和路由器资源。
      SPFHOLDINTERVAL:
        name: SPF计算基数间隔时间（ms）
        desc: 指定通过智能定时器设置OSPF SPF计算的基数间隔时间。通过调节SPF的计算间隔，可以抑制网络频繁变化可能导致的占用过多带宽资源和路由器资源。
      RTTAGDISFLAG:
        name: 禁止使用tag检测环路
        desc: 禁止使用tag检测环路。
      ECAROUTEFLAG:
        name: 使能ECA路由类型
        desc: 为VPN使能的ECA路由类型。
      DOMAINNULLFLAG:
        name: 配置Domain ID为空
        desc: 设置该标志删除所有Domain ID配置。
      SUPPREACH:
        name: 使能可达性抑制
        desc: 使能可达性抑制。
      SPFCONSERVFLAG:
        name: SPF正常模式标志
        desc: SPF正常模式标志。
      SHAMHELLOFLAG:
        name: 使能Sham-hello
        desc: OSPF特有特性，使能Sham-hello后，节点收到任何有效的OSPF报文，都保持活动状态。
      MPLSLDPAUTOCFG:
        name: 是否自动使能MPLS LDP功能
        desc: 是否使能指定OSPF进程下所有可建立OSPF邻居的接口自动使能MPLS LDP的功能。
      VIRTUALSYSFLAG:
        name: OSPF共网段虚拟系统使能标志
        desc: OSPF共网段虚拟系统使能标志。
