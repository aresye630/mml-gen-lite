  ADD OSPFINTERFACE:
    name: 创建OSPF接口配置
    func: 该命令用于使能一个新的接口到OSPF进程的区域下。
    params:
      PROCID:
        name: 进程号
        desc: OSPF进程号。
      AREAID:
        name: 区域标识
        desc: OSPF区域号。
      IFNAME:
        name: 接口名
        desc: 指定特定的接口名称。
      DRPRI:
        name: 指定路由器优先级
        desc: 指定路由器优先级。
      NETWORKTYPE:
        name: 接口网络类型
        desc: 接口网络类型。
      P2MPMASKIGN:
        name: 在P2MP网络上忽略网络掩码
        desc: 设置在P2MP网络上忽略对网络掩码的检查，在P2MP网络上，当设备的掩码长度不一致时，使用此命令忽略对Hello报文中网络掩码的检查，从而可以正常建立OSPF邻居关系。
      SMARTDISCOVER:
        name: 使能Smart-Discover
        desc: 是否使能Smart-discover特性。
      TIMERDEADINTV:
        name: 邻居失效的时间（s）
        desc: OSPF邻居失效的时间。OSPF邻居的失效时间是指：在该时间间隔内，若未收到邻居的Hello报文，就认为该邻居已失效。OSPF协议不支持NULL接口的配置。
      TIMERHELLOINTV:
        name: 邻居发送Hello包时间间隔（s）
        desc: 接口发送Hello报文的时间间隔。hello interval的值写入Hello报文中后随之发送。hello interval的值越小，发现网络拓扑改变的速度越快，路由开销也就越大。确定接口和邻接路由器的参数要保持一致。
          OSPF协议不支持NULL接口的配置。
      TIMERCONSERFLAG:
        name: 是否使能邻居失效定时器保守模式
        desc: 是否使能邻居失效定时器保守模式。使能后，即使邻居失效时间小于10s，仍按照实际配置值来判断邻居是否失效。
      TIMERRETRANINTV:
        name: 重发LSA的时间间隔（s）
        desc: 接口重传LSA的时间间隔。当一台路由器向它的邻居发送一条＂链路状态广播＂（LSA）后，需要等到对方的确认报文。若在该重传LSA的时间间隔内未收到对方的确认报文，就会重传这条LSA。
          相邻路由器重传LSA时间间隔的值不要设置得太小，否则将会引起不必要的重传。 OSPF协议不支持NU
      TIMERPOLLINTV:
        name: 发送Hello报文的Poll时间间隔（s）
        desc: 发送轮询Hello报文的时间间隔。在NBMA网络上，当邻居失效后，路由器将按ospf timer poll设置的轮询时间间隔定期地发送Hello报文。轮询时间间隔值至少应为Hello报文时间间隔的4倍。
          OSPF协议不支持NULL接口的配置。
      TIMERWAITINTV:
        name: 等待超时时间（s）
        desc: 等待时间。
