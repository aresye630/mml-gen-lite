cmd_param_desc:
  ADD ACLRULEADV4:
    name: 增加高级ACL规则
    func: 该命令用于创建高级ACL规则。高级ACL可以基于五元组（源目的IP，源目的端口号，协议号）进行报文匹配。主要应用场景为路由策略以及端口流量策略等。
    params:
      ACLNAME:
        name: ACL规则组标识
        desc: 该参数用于指定规则属于哪个规则组。
      ACLRULENAME:
        name: 规则名称
        desc: 该参数用于指定规则名称。
      ACLRULEID:
        name: 规则ID
        desc: 该参数用于指定规则的ID。如果不输入该参数，则规则ID按照规则组步长增长。
      ACLACTION:
        name: 规则行为
        desc: 该参数用于指定对符合本规则的报文采取的动作。
      ACLFRAGTYPE:
        name: 报文分片类型
        desc: 该参数用于指定规则所的报文分片类型，共有分片报文中的首片、分片报文中的非首片、非分片报文三种报文类型。如果不输入该参数，则表示不校验报文的分片信息。
      ACLSOURCEIP:
        name: 源IP地址
        desc: 该参数用于指定规则要匹配的源IPv4地址。
      ACLSRCWILD:
        name: 源IP地址反掩码
        desc: 该参数用于指定规则要匹配的源IPv4地址反掩码。
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用于指定规则匹配要生效的VPN实例。
      ACLRULEDESCRIPTION:
        name: 规则描述
        desc: 该参数用于指定规则描述。
      ACLPROTOCOL:
        name: 协议类型值
        desc: 该参数用于指定规则协议类型。
      ACLDESTIP:
        name: 目的IP地址
        desc: 该参数用于指定规则要匹配的目的IPv4地址。
      ACLDESTWILD:
        name: 目的IP地址反掩码
        desc: 该参数用于指定规则要匹配的目的IPv4地址反掩码。
      ACLSRCPORTOP:
        name: 源端口范围类型
        desc: 该参数用于指定规则源端口范围类型。如果不输入该参数，则表示不校验报文的源端口。
      ACLSRCPORTBEGIN:
        name: 源端口的开始端口号
        desc: 该参数用于指定规则源端口号的开始端口。
      ACLSRCPORTEND:
        name: 源端口的结束端口号
        desc: 该参数用于指定规则源端口号的结束端口。
      ACLDESTPORTOP:
        name: 目的端口范围类型
        desc: 该参数用于指定规则目的端口范围类型。如果不输入该参数，则表示不校验报文的目的端口。
      ACLDESTPORTBEGIN:
        name: 目的端口的开始端口号
        desc: 该参数用于指定规则目的端口号的开始端口。
      ACLDESTPORTEND:
        name: 目的端口的结束端口号
        desc: 该参数用于指定规则目的端口号的结束端口。
      ACLPRECEDENCE:
        name: 报文优先级
        desc: 该参数用于指定规则的报文优先级。如果不输入该参数，则表示不校验报文优先级。
      ACLTOS:
        name: 服务优先级
        desc: 该参数用于指定规则的数据包过滤服务优先级。如果不输入该参数，则表示不校验报文的服务优先级。
      ACLDSCP:
        name: DSCP值
        desc: 该参数用于指定规则的差分服务码。如果不输入该参数，则表示不校验报文的差分服务码。
      ACLICMPNAME:
        name: ICMP名称
        desc: 该参数用于指定规则的网络控制管理协议名称。如果不输入该参数，则表示不校验报文的ICMP名称。
      ACLICMPTYPE:
        name: 网络控制管理协议类型
        desc: 该参数用于指定规则的网络控制管理协议报文的类型。
      ACLICMPCODE:
        name: 网络控制管理协议消息码
        desc: 该参数用于指定规则的网络控制管理协议消息码。
      ACLSYNFLAG:
        name: TCP-FLAG
        desc: 该参数用于指定规则的TCP-Flag值。如果不输入该参数，则表示不校验报文的TCP-Flag值。
      ACLTTLOP:
        name: TTL范围
        desc: 该参数用于指定TTL的范围。如果不输入该参数，则表示不校验报文的TTL的范围。
      ACLTTL:
        name: TTL值
        desc: 该参数用于指定TTL的值。
      ACLTTLEND:
        name: 结束TTL值
        desc: 该参数用于指定TTL的结束值。
  ADD ACLRULEADV4IPSEC:
    name: 增加高级ACL规则
    func: ''
    params:
      ACLNAME:
        name: ACL规则组标识
        desc: 该参数用于指定规则属于哪个规则组。
      ACLRULENAME:
        name: 规则名称
        desc: 该参数用于指定规则名称。
      ACLRULEID:
        name: 规则ID
        desc: 该参数用于指定规则的ID。如果不输入该参数，则规则ID按照规则组步长增长。
      ACLACTION:
        name: 规则行为
        desc: 该参数用于指定对符合本规则的报文采取的动作。
      ACLFRAGTYPE:
        name: 报文分片类型
        desc: 该参数用于指定规则所的报文分片类型，共有分片报文中的首片、分片报文中的非首片、非分片报文三种报文类型。如果不输入该参数，则表示不校验报文的分片信息。
      ACLSOURCEIP:
        name: 源IP地址
        desc: 该参数用于指定规则要匹配的源IPv4地址。
      ACLSRCWILD:
        name: 源IP地址反掩码
        desc: 该参数用于指定规则要匹配的源IPv4地址反掩码。
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用于指定规则匹配要生效的VPN实例。
      ACLRULEDESCRIPTION:
        name: 规则描述
        desc: 该参数用于指定规则描述。
      ACLPROTOCOL:
        name: 协议类型值
        desc: 该参数用于指定规则协议类型。
      ACLDESTIP:
        name: 目的IP地址
        desc: 该参数用于指定规则要匹配的目的IPv4地址。
      ACLDESTWILD:
        name: 目的IP地址反掩码
        desc: 该参数用于指定规则要匹配的目的IPv4地址反掩码。
      ACLSRCPORTOP:
        name: 源端口范围类型
        desc: 该参数用于指定规则源端口范围类型。如果不输入该参数，则表示不校验报文的源端口。
      ACLSRCPORTBEGIN:
        name: 源端口的开始端口号
        desc: 该参数用于指定规则源端口号的开始端口。
      ACLSRCPORTEND:
        name: 源端口的结束端口号
        desc: 该参数用于指定规则源端口号的结束端口。
      ACLDESTPORTOP:
        name: 目的端口范围类型
        desc: 该参数用于指定规则目的端口范围类型。如果不输入该参数，则表示不校验报文的目的端口。
      ACLDESTPORTBEGIN:
        name: 目的端口的开始端口号
        desc: 该参数用于指定规则目的端口号的开始端口。
      ACLDESTPORTEND:
        name: 目的端口的结束端口号
        desc: 该参数用于指定规则目的端口号的结束端口。
      ACLPRECEDENCE:
        name: 报文优先级
        desc: 该参数用于指定规则的报文优先级。如果不输入该参数，则表示不校验报文优先级。
      ACLTOS:
        name: 服务优先级
        desc: 该参数用于指定规则的数据包过滤服务优先级。如果不输入该参数，则表示不校验报文的服务优先级。
      ACLDSCP:
        name: DSCP值
        desc: 该参数用于指定规则的差分服务码。如果不输入该参数，则表示不校验报文的差分服务码。
      ACLICMPNAME:
        name: ICMP名称
        desc: 该参数用于指定规则的网络控制管理协议名称。如果不输入该参数，则表示不校验报文的ICMP名称。
      ACLICMPTYPE:
        name: 网络控制管理协议类型
        desc: 该参数用于指定规则的网络控制管理协议报文的类型。
      ACLICMPCODE:
        name: 网络控制管理协议消息码
        desc: 该参数用于指定规则的网络控制管理协议消息码。
      ACLSYNFLAG:
        name: TCP-FLAG
        desc: 该参数用于指定规则的TCP-Flag值。如果不输入该参数，则表示不校验报文的TCP-Flag值。
  ADD AGENTIP:
    name: 增加远端地址池代理IP信息
    func: ''
    params:
      POOLNAME:
        name: 地址池名称
        desc: 该参数用于指定配置代理IP地址的地址池名称。
      SECTIONNUM:
        name: 地址段号
        desc: 该参数用于指定配置代理IP地址的地址段号。
      IPVERSION:
        name: IP地址类型
        desc: 该参数用于指定配置代理IP地址的地址类型。
      V4AGENTIP:
        name: IPv4代理地址
        desc: 该参数用于指定IPv4代理地址。
      V6AGENTIP:
        name: IPv6代理地址
        desc: 该参数用于指定IPv6代理地址。
  ADD APNIMSSIGFLTR:
    name: 添加APN的IMS分类器
    func: '**须知**'
    params:
      APN:
        name: APN名称
        desc: 该参数用于指定APN实例名。
      PRIORITY:
        name: 优先级
        desc: 该参数用于指定静态分组过滤优先级。值越小优先级越高。
      IPVERSION:
        name: IP地址版本
        desc: 该参数用于指定过滤规则是IPv4类型还是IPv6类型。
      SRCIPV4SPECTYPE:
        name: 源IPv4地址指定方式
        desc: 该参数用于指定P-CSCF数据包服务器的IPv4地址是使用特定地址还是使用任意地址。
      SRCIPV4ADDR:
        name: 源IPv4地址
        desc: 该参数用于指定P-CSCF数据包服务器的IPv4地址。
      SRCIPV4MASKLEN:
        name: 源IPv4地址掩码长度
        desc: 该参数用于指定P-CSCF数据包服务器IPv4地址的地址掩码长度。
      SRCIPV6SPECTYPE:
        name: 源IPv6地址指定方式
        desc: 该参数用于指定P-CSCF数据包服务器的IPv6地址是使用特定地址还是使用任意地址。
      SRCIPV6ADDR:
        name: 源IPv6地址
        desc: 该参数用于指定P-CSCF数据包服务器的IPv6地址。
      SRCIPV6PREFLEN:
        name: 源IPv6地址前缀长度
        desc: 该参数用于指定P-CSCF数据包服务器IPv6地址的地址前缀长度。
      SRCPORTSPECTYPE:
        name: 源端口指定方式
        desc: 该参数用于指定P-CSCF服务器端口是使用特定端口还是使用任意端口。
      SRCPORTSTART:
        name: 源端口号开始
        desc: 该参数用于指定服务器端口起始值。
      SRCPORTEND:
        name: 源端口号结束
        desc: 该参数用于指定服务器端口终止值。
      DSTIPV4SPECTYPE:
        name: 目的IPv4地址指定方式
        desc: 该参数用于指定数据包手机的IPv4地址是使用特定地址还是使用任意地址。
      DSTIPV4ADDR:
        name: 目的IPv4地址
        desc: 该参数用于指定数据包手机的IPv4地址。
      DSTIPV4MASKLEN:
        name: 目的IPv4地址掩码长度
        desc: 该参数用于指定数据包手机IPv4地址的地址掩码长度。
      DSTIPV6SPECTYPE:
        name: 目的IPv6地址指定方式
        desc: 该参数用于指定数据包手机的IPv6地址是使用特定地址还是使用任意地址。
      DSTIPV6ADDR:
        name: 目的IPv6地址
        desc: 该参数用于指定数据包手机的IPv6地址。
      DSTIPV6PREFLEN:
        name: 目的IPv6地址前缀长度
        desc: 该参数用于指定数据包手机IPv6地址的地址前缀长度。
      DSTPORTSPECTYPE:
        name: 目的端口指定方式
        desc: 该参数用于指定手机端口是使用特定端口还是使用任意端口。
      DSTPORTSTART:
        name: 目的端口号开始
        desc: 该参数用于指定手机端口起始值。
      DSTPORTEND:
        name: 目的端口号结束
        desc: 该参数用于指定手机端口终止值。
      PROSPECTYPE:
        name: 协议指定方式
        desc: 该参数用于指定协议号是使用特定协议号还是使用任意协议号。
      PROTOCOL:
        name: 协议类型
        desc: 该参数用于指定协议号。
  ADD AUTOSCALINGBFD:
    name: 增加BFD会话自动化配置模板
    func: 该命令在静态路由场景或动态协议场景下，用于添加动态或静态BFD会话自动化配置模板。
    params:
      TEMPLATENAME:
        name: 模板名称
        desc: 该参数用于指定BFD自动化配置模板名称。
      BFDTYPE:
        name: BFD类型
        desc: 该参数用来表示BFD自动化配置模板类型。
      SERVICENAME:
        name: 服务名称
        desc: 该参数用来表示接口自动化配置服务模板名称。要求和ADD AUTOSCALINGSERVICE命令中配置的SERVICENAME参数保持一致。
      IPVERSION:
        name: IP版本
        desc: 该参数用来表示IP版本。
      DESTADDR4:
        name: 目的地址
        desc: 该参数用于表示IPv4目的地址。
      DESTADDR6:
        name: 目的地址
        desc: 该参数用于表示IPv6目的地址。
      MINECHORXINT:
        name: 单臂Echo会话的收包间隔（ms）
        desc: 该参数用于表示单臂Echo会话的收包间隔（ms）。
      MINRXINTERVAL:
        name: 动态BFD会话的收包间隔（ms）
        desc: 该参数用于表示动态BFD会话的收包间隔。
      MINTXINTERVAL:
        name: 动态BFD会话的发包间隔（ms）
        desc: 该参数用于表示动态BFD会话的发包间隔。
      DETECTMULTI:
        name: 检测倍数
        desc: 该参数用于表示检测倍数，如果BFD会话在设置的检测周期内没有收到对端发来的BFD报文，则认为链路发生了故障，BFD会话的状态将会置为Down。
      ONEARMECHO:
        name: 单臂Echo
        desc: 该参数用于指定是否是单臂echo功能BFD会话。
  ADD AUTOSCALINGSERVICE:
    name: 增加自动化配置参数
    func: 该命令用于增加接口自动化配置模板，基于模板的参数自动生成以太接口下的配置。
    params:
      SERVICENAME:
        name: 服务名称
        desc: 该参数用于指定接口自动化配置服务模板的名称。
      VPNNAME:
        name: VPN实例名称
        desc: 该参数用于指定VPN实例名称。配置该参数前，须先使用ADD L3VPNINST命令添加VPN实例。
      AFTYPE:
        name: 地址族
        desc: 该参数用于指定地址族类型。
      IPALLOCTYPE4:
        name: IPv4地址分配方式
        desc: 该参数用于指定IPv4地址分配方式。用户配置方式是指用户配置地址池指定接口地址
      IPALLOCTYPE6:
        name: IPv6地址分配方式
        desc: 该参数用于指定IPv6地址分配方式。用户配置方式是指用户配置地址池指定接口地址
      AUTOCFGIFTYPE:
        name: 自动化配置接口类型
        desc: 该参数用于指定自动化配置接口类型。虚拟网卡是指对以太接口实现自动化配置；以太Trunk是指对以太Trunk接口实现自动化配置。
      ETHTRUNKTMPID:
        name: 以太Trunk模板ID
        desc: 该参数用于指定以太Trunk模板ID。配置该参数前，须先使用ADD AUTOSCALINGETHTRUNK命令添加以太Trunk模板。
      VNICID:
        name: 虚拟网卡ID
        desc: 该参数用于指定接口的虚拟网卡ID。该虚拟网卡ID即为以太网主接口ID。
      VLANID:
        name: VLAN ID
        desc: 该参数用于指定VLAN ID。该VLAN ID表示以太网子接口ID。配置该参数后，如果子接口不存在，将会新增子接口，可以通过执行LST
          INTERFACE命令查询接口变化。
      BEGINADDR4:
        name: 起始地址
        desc: 该参数用于指定IPv4地址池的起始地址。
      ENDADDR4:
        name: 结束地址
        desc: 该参数用于指定IPv4地址池的结束地址。
      BEGINADDR6:
        name: 起始地址
        desc: 该参数用于指定IPv6地址池的起始地址。
      ENDADDR6:
        name: 结束地址
        desc: 该参数用于指定IPv6地址池的结束地址。
      MASKLEN:
        name: 地址池掩码长度
        desc: IPv4场景，该参数用于指定扩容业务的地址池掩码长度；IPv6场景，该参数用于指定扩容业务的地址池前缀长度。
      OSPFENABLE:
        name: 使能OSPF
        desc: 该参数用于指定是否将扩容出的接口都使能单个OSPF进程。
      OSPFPROCID:
        name: OSPF进程ID
        desc: 该参数用于指定扩容业务OSPF的进程ID。 根据AFTYPE来区分是OSPFv2协议还是OSPFv3协议。 配置该参数前，若地址族参数AFTYPE取值为IPv4时须先使用ADD
          OSPF命令添加OSPF特性的进程，若地址族参数AFTYPE取值为IPv6时须先使用ADD OSPFV
      OSPFAREAID:
        name: OSPF区域ID
        desc: 该参数用于指定扩容业务OSPF的区域ID。 根据AFTYPE来区分是OSPFv2协议还是OSPFv3协议。 配置该参数前，须先使用ADD
          OSPFAREA命令在OSPF进程下创建区域。
      OSPFINSTID:
        name: OSPF实例ID
        desc: 该参数用于指定扩容业务OSPFv3的实例ID。配置该参数前，需指定AFTYPE参数为IPv6。
      OSPFCOST:
        name: OSPF开销
        desc: 该参数用于指定扩容业务OSPF的开销值。 根据AFTYPE来区分是OSPFv2协议还是OSPFv3协议。
      OSPFHELLOTIMER:
        name: 邻居发送Hello包时间间隔（s）
        desc: 该参数用于指定接口发送Hello报文的时间间隔。OSPFHELLOTIMER的值写入Hello报文中后随之发送。OSPFHELLOTIMER的值越小，发现网络拓扑改变的速度越快，路由开销也就越大。确定接口和邻接路由器的参数要保持一致。
      OSPFDEADTIMER:
        name: 邻居失效的时间（s）
        desc: 该参数用于指定OSPF邻居失效的时间。OSPF邻居的失效时间是指：在该时间间隔内，若未收到邻居的Hello报文，就认为该邻居已失效。
      TPINENABLE:
        name: 使能入方向的流量策略
        desc: 该参数用于指定是否使能入方向的流量策略。
      TPINNAME:
        name: 入方向的流量策略名称
        desc: 该参数用于指定扩容业务入方向的流量策略名称。配置该参数前，须先使用ADD MQCPOLICY命令添加流量策略。
      TPINLINKFLAG:
        name: 入方向的流量策略链接标记
        desc: 该参数用于指定扩容业务入方向的流量策略链接标记。配置该参数前，须先使用ADD MQCPOLICY命令添加流量策略。
      TPOUTENABLE:
        name: 使能出方向的流量策略
        desc: 该参数用于指定是否使能出方向的流量策略。
      TPOUTNAME:
        name: 出方向的流量策略名称
        desc: 该参数用于指定扩容业务出方向的流量策略名称。配置该参数前，须先使用ADD MQCPOLICY命令添加流量策略。
      TPOUTLINKFLAG:
        name: 出方向的流量策略链接标记
        desc: 该参数用于指定扩容业务出方向的流量策略链接标记。配置该参数前，须先使用ADD MQCPOLICY命令添加流量策略。
      MTU:
        name: 最大传输单元
        desc: 该参数用于指定扩容业务接口最大传输单元。若模板配置为0，自动化配置生成MTU为1500。
      FLOWMODE:
        name: 引流模式
        desc: 该参数用于指定引流模式。该引流模式用于配置接口的WLR业务引流重定向功能。配置引流表模式时将接口收到的来自DPU的报文与WLR引流表进行匹配，如果匹配成功，则将报文引流到CSLB_VNFC中进行处理；否则，再查找路由表转发报文。配置路由模式时仅匹配路由表进行报文引流。
      NETWORKINSTID:
        name: 网络分组标识
        desc: 该参数用于指定网络分组标识。需要根据网络规划确定网络分组标识。
      ISBACKUP:
        name: 备用路由组标记
        desc: 该参数用于指定备用路由组标记。该参数为TRUE表示接口服务模板在保护组上生效，否则在非保护组上生效。
      TRUSTUPSTREAM:
        name: 简单流分类QoS策略
        desc: 该参数用于指定简单流分类QoS策略。
      OSPFGRPENABLE:
        name: 使能OSPF进程组
        desc: 该参数用于使能OSPF进程组。
      OSPFGRPID:
        name: OSPF进程组ID
        desc: 该参数用于指定OSPF进程组ID。 根据AFTYPE来区分是OSPFv2协议还是OSPFv3协议。 配置该参数前，须先使用ADD AUTOSCALINGOSPFPROCGRP命令添加OSPF进程组模板。
      ADDRMODE:
        name: 地址模式
        desc: 该参数用于标识申请的地址是主机地址还是网段地址。
  ADD AUTOSCALINGSRBFD:
    name: 增加静态路由的动态BFD自动化配置模板
    func: 该命令用于添加静态路由的动态BFD自动化配置模板。
    params:
      SERVICENAME:
        name: 服务名称
        desc: 该参数用来表示接口自动化配置服务模板名称。要求和ADD AUTOSCALINGSERVICE命令中配置的SERVICENAME参数保持一致。
      IPVERSION:
        name: 地址族
        desc: 该参数用来表示IP地址类型。
      MINRXINTERVAL:
        name: 最小接收间隔（ms）
        desc: 该参数用于指定期望从对端接收BFD报文的最小接收间隔。如果未指定，采用全局缺省值。
      MINTXINTERVAL:
        name: 最小发送间隔（ms）
        desc: 该参数用于指定向对端发送BFD报文的最小传输间隔。如果未指定，采用全局缺省值。
      MULTIPLIER:
        name: 检测倍数
        desc: 该参数用于指定本地检测倍数。如果未指定，采用全局缺省值。
  ADD AUTOSCALINGSRROUTE:
    name: 增加静态路由自动化配置模板
    func: 该命令用于添加静态路由自动化配置模板。
    params:
      SERVICENAME:
        name: 服务名称
        desc: 该参数用来表示接口自动化配置服务模板名称。要求和ADD AUTOSCALINGSERVICE命令中配置的SERVICENAME参数保持一致。
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用来指定VPN实例的名称。
      IPVERSION:
        name: 地址族
        desc: 该参数用来指定VPN实例的地址族信息。
      PREFIX4:
        name: 路由前缀IPv4
        desc: 该参数用来指定IPv4前缀信息。
      PREFIX6:
        name: 路由前缀IPv6
        desc: 该参数用来指定IPv6前缀信息。
      MASKLENGTH:
        name: 路由掩码长度
        desc: IPv4场景，该参数用于表示路由的掩码长度；IPv6场景，该参数用于表示路由的前缀长度。
      NEXTHOPALLOCTYPE4:
        name: IPv4路由下一跳分配方式
        desc: 该参数用于指定IPv4路由下一跳的获取方式。用户配置方式是指用户配置静态路由的下一跳；DHCP方式是指静态路由下一跳支持DHCP联动。
      NEXTHOPALLOCTYPE6:
        name: IPv6路由下一跳分配方式
        desc: 该参数用于指定IPv6路由下一跳的获取方式。用户配置方式是指用户配置静态路由的下一跳；DHCP方式是指静态路由下一跳支持DHCP联动。
      NEXTHOP4:
        name: 路由下一跳IPv4
        desc: 该参数用来指定IPv4下一跳IP地址。
      NEXTHOP6:
        name: 路由下一跳IPv6
        desc: 该参数用来指定IPv6下一跳IP地址。
      PREFERENCE:
        name: 路由优先级
        desc: 该参数用来指定路由优先级。
      BFDENABLE:
        name: BFD使能标识
        desc: BFD使能标识。为静态路由模板使能BFD，若使能静态路由动态BFD则依赖ADD AUTOSCALINGSRBFD命令配置，若使能静态路由静态BFD，则依赖ADD
          AUTOSCALINGBFD命令且配置BFDTYPE为Static。
      TAG:
        name: 路由tag
        desc: 该参数用来指定路由的tag。
      DESCRIPTION:
        name: 路由描述
        desc: 该参数用来指定路由的描述信息。
      BFDTEMPLATENAME:
        name: BFD模板名称
        desc: 该参数用来指定BFD自动化配置模板名称。该参数由ADD AUTOSCALINGBFD命令配置获得。
  ADD BCSRVLEVELPLY:
    name: 增加带宽管理控制器业务级别策略
    func: 该命令用于配置指定BWM控制器下，特定ServiceLevel的业务流量保证带宽比例和峰值带宽比例。
    params:
      BWMCNAME:
        name: 带宽管理控制器名称
        desc: 该参数用于表示带宽管理控制器的名字。
      SERVICELEVEL:
        name: 业务级别
        desc: 该参数用于指定使用同一控制器的不同业务流间的优先级，值越小优先级越高。如果配置优先级，优先保证高优先级的带宽。
      CIRRATE:
        name: 承诺信息速率比例
        desc: 该参数用于表示此业务等级的保证带宽比例，此业务等级实际承诺信息速率相当于CIRRate*CIR（BwmController命令）。
      PIRRATE:
        name: 峰值信息速率比例
        desc: 该参数用于表示此业务等级的峰值带宽比例，此业务等级实际峰值信息速率相当于PIRRate*PIR（BwmController命令）。
      MAXPKTLOSTRATE:
        name: 最大丢包率
        desc: 该参数用于表示此业务等级的最大丢包比率。
      SHAPRATE:
        name: 流量整形速率比例
        desc: 该参数用于表示此业务等级的最高峰值带宽比例，实际承诺信息速率相当于ShapRate* RATE（BwmController命令）。
      MAXINCRDELAY:
        name: 最大增加时延
        desc: 该参数用于表示此业务等级因Shaping队列缓存的最大增加时延。
  ADD BGPPEER:
    name: 增加BGP对等体
    func: 该命令用于增加IPv4或IPv6地址类型的对等体。
    params:
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用于指定用户所配置的VPN实例名称。
      ADDRESSTYPE:
        name: 地址类型
        desc: 该参数用于指定对等体的地址类型。
      PEERADDR:
        name: IPv4对等体地址
        desc: 该参数用于指定连接对等体的IPv4接口地址。
      PEERADDRV6:
        name: IPv6对等体地址
        desc: 该参数用于指定连接对等体的IPv6接口地址。
      REMOTEAS:
        name: 对等体AS号
        desc: 该参数用于指定对等体所在AS号。
      GROUPNAME:
        name: 组名
        desc: 该参数用于指定对等体所在的对等体组。
      ROUTEREFRESH:
        name: 路由刷新
        desc: 该参数用于指定对等体是否向对端发送REFRESH报文。
      FOURBYTEAS:
        name: 4字节AS号功能
        desc: 该参数用于指定对等体是否使能4字节AS号。
      CONVENTIONAL:
        name: 常规路由器
        desc: 该参数用于指定对等体是否为常规路由器，不使能扩展能力。
      LOCALIFADDR:
        name: 本地接口地址
        desc: 该参数用于指定与对等体建立连接的本地接口地址。
      LOCALIFNAME:
        name: 本地接口名称
        desc: 该参数用于指定与对等体相连的本地接口名称。
      EBGPMAXHOP:
        name: EBGP最大跳数
        desc: 该参数用于指定BGP同非直连网络上的对等体建立EBGP连接时允许的最大跳数。
      VALIDTTLHOPS:
        name: 需要检测的TTL跳数值
        desc: 该参数用于指定在BGP对等体上应用GTSM功能，并设置跳数。
      FAKEAS:
        name: 伪AS号
        desc: 该参数用于指定对等体采用伪AS号与本端建立连接。
      ISIGNORE:
        name: 是否忽略
        desc: 该参数用于指定是否忽略与指定对等体建立会话。
      CONNECTMODE:
        name: 连接模式
        desc: 该参数用于指定对等体组的建接方式，只侦听连接请求或只发起连接。
      ISLOGCHANGE:
        name: 是否记录日志
        desc: 该参数用于配置是否使能BGP记录指定对等体/对等体组会话状态和事件信息的功能。
      PSWDTYPE:
        name: 密码类型
        desc: 该参数用于指定认证密码的类型。
      PSWDCIPHERTEXT:
        name: 密码
        desc: 该参数用于指定的认证密码。
      KEEPALIVETIME:
        name: 存活时间（s）
        desc: 该参数用于指定对等体的保活时间。
      HOLDTIME:
        name: 保持时间（s）
        desc: 该参数用于指定对等体的保持时间。
      KEYCHAINNAME:
        name: Keychain名称
        desc: 该参数用于指定该对等体组TCP连接时的Keychain认证名称。
      PATHMTUDISCOVERY:
        name: 路径MTU发现功能
        desc: 该参数用于指定该对等体是否能够进行路径MTU自动发现。
      DESCRIPTION:
        name: 描述
        desc: 该参数用于为该对等体组添加描述信息。
      TRACKINGENABLE:
        name: 使能快速感知邻居不可达并断开连接功能
        desc: 该参数用于指定是否使能Tracking功能，快速感知邻居断连。
      TRACKINGDELAYTIME:
        name: 邻居断连延迟时间（s）
        desc: 该参数用于指定Tracking功能的延时时间。
      CONNRETRYTIME:
        name: 重连时间（s）
        desc: 该参数用于指定全局连接重传时间间隔。
  ADD BGPPEERAF:
    name: 增加BGP对等体地址族
    func: 对等体可以有多个地址族，该命令用于添加BGP IPv4或IPv6对等体地址族。
    params:
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用于指定VPN实例名称。
      AFTYPE:
        name: 地址族类型
        desc: 该参数用于指定地址族类型。
      ADDRESSTYPE:
        name: 地址类型
        desc: 该参数用于指定对等体的地址类型。
      REMOTEADDRESS:
        name: IPv4对等体地址
        desc: 该参数用于指定连接对等体的IPv4接口地址。
      REMOTEADDRESSV6:
        name: IPv6对等体地址
        desc: 该参数用于指定连接对等体的IPv6接口地址。
      PEERGROUPNAME:
        name: 所属对等体组名称
        desc: 该参数用于指定路由器所属对等体组名称。
      ADVERTISECOMMUNITY:
        name: 团体属性发布
        desc: 该参数用于选择是否将团体属性发布给对等体。
      ADVERTISEEXTCOMMUNITY:
        name: 扩展团体属性发布
        desc: 该参数用于选择是否将扩展团体属性发布给对等体。
      DISCARDEXTCOMMUNITY:
        name: 扩展团体属性丢弃
        desc: 该参数用于选择是否丢弃路由信息中的扩展团体属性。
      ALLOWASLOOPENABLE:
        name: 允许AS号重复
        desc: 该参数用于选择是否允许对等体发送AS_Path中含有本地AS号的路由。
      ALLOWASLOOPLIMIT:
        name: 允许AS号重复数
        desc: 该参数用于指定允许的AS号最大重复个数。
      DEFAULTRTADVENABLE:
        name: 允许缺省路由通告
        desc: 该参数用于选择是否向对等体发布缺省路由。
      DEFAULTRTADVPOLICY:
        name: 缺省路由通告策略
        desc: 该参数用于指定配置路由的发布策略。
      DEFAULTRTMATCHMODE:
        name: 带条件匹配缺省路由发布
        desc: 该参数用于指定缺省路由匹配的模式。
      KEEPALLROUTES:
        name: 全局路由更新保存
        desc: 该参数用于指定是否保存自BGP连接建立之后的所有来自对等体（组）的BGP路由更新信息，即使这些路由没有通过已配置的入口策略。
      NEXTHOPCONFIGURE:
        name: 下一跳处理模式
        desc: 该参数用于指定向IBGP对等体发送路由时是否将下一跳改为本地接口地址。
      PREFERREDVALUE:
        name: 路由首选值
        desc: 该参数用于指定BGP路由的首选值。
      PUBLICASONLY:
        name: 仅携带公有AS号
        desc: 该参数用于指定发送BGP更新报文时AS_Path属性不携带私有AS号，仅携带公有AS号。
      ROUTELIMIT:
        name: 路由超限阈值
        desc: 该参数用于指定从BGP对等体收到的最大路由数量。
      ROUTELIMITPERCENT:
        name: 路由超限百分比
        desc: 该参数用于指定路由器开始生成告警消息时的路由数量的百分比，当数量超过（number×alert-percent）÷100时，开始发出警告信息。
      ROUTELIMITTYPE:
        name: 路由超限告警类型
        desc: 该参数用于指定路由器接收路由数超出允许接收的最大路由数时的动作类型。
      ROUTELIMITIDLETIMEOUT:
        name: 超时定时器（min）
        desc: 该参数用于指定当路由超限断开连接后，设置自动重新建立连接超时定时器的时间，在定时器超时前，不自动重新建立连接。
      RTUPDTINTERVAL:
        name: 路由更新时间（s）
        desc: 该参数用于指定向指定对等体/对等体组发送相同路由前缀更新报文的时间间隔。
      REFLECTCLIENT:
        name: 路由反射器客户
        desc: 该参数用于指定本机作为路由反射器。
      SUBSTITUTEASENABLE:
        name: 替换AS Path属性
        desc: 该参数用于指定是否使能替换AS_PATH中指定对等体的AS号。
      IMPORTRTPOLICYNAME:
        name: 引入路由策略
        desc: 该参数用于指定本机路由的入口策略。
      EXPORTRTPOLICYNAME:
        name: 发布路由策略
        desc: 该参数用于指定本机路由的出口策略。
      IMPORTPREFFILTNAME:
        name: 引入前缀过滤策略
        desc: 该参数用于指定IPv4地址族的入口Prefix过滤策略。
      EXPORTPREFFILTNAME:
        name: 发布前缀过滤策略
        desc: 该参数用于指定IPv4地址族的出口Prefix过滤策略。
      IMPORTASPATHFILTER:
        name: 接收路由AS Path过滤
        desc: 该参数用于指定本地的入口AS_PATH过滤策略名称。
      EXPORTASPATHFILTER:
        name: 发布路由AS Path过滤
        desc: 该参数用于指定本地的出口AS_PATH过滤策略名称。
      IMPORTACLNAMEORNUM:
        name: 接收路由ACL规则标识
        desc: 该参数用于指定路由器入口方向上的IPv4地址族访问控制列表（ACL）名称。
      EXPORTACLNAMEORNUM:
        name: 发布路由ACL规则标识
        desc: 该参数用于指定路由器出口方向上IPv4地址族的访问控制列表（ACL）名称。
      ADVBESTEXTERNAL:
        name: 是否发布bestExternal路由
        desc: 该参数用于指定是否发布bestExternal路由。
      ADVADDPATHNUM:
        name: 向邻居发布多少条add-path路由
        desc: 该参数用于指定向邻居发布多少条add-path路由。
      ADDPATHMODE:
        name: add-path模式
        desc: 该参数用于指定add-path模式。
      PUBLICASONLYFORCE:
        name: 强制删除私有AS号
        desc: 该参数用于指定是否强制删除私有as号。
      PUBLICASONLYLIMITED:
        name: 删除左边的私有AS号
        desc: 该参数用于指定是否删除左边的私有AS号。
      PUBLICASONLYREPLACE:
        name: 用本地AS号替换所有的私有AS号
        desc: 该参数用于指定是否用本地AS号替换所有的私有AS号。
      INCLUDEPEERAS:
        name: 不忽略BGP邻居的AS号
        desc: 该参数用于指定是否忽略BGP邻居的AS号。
      IMPORTACL6NAMEORNUM:
        name: 接收路由ACL6规则标识
        desc: 该参数用于指定路由器入口方向上的IPv6地址族访问控制列表（ACL）编号或者名称。
      EXPORTACL6NAMEORNUM:
        name: 发布路由ACL6规则标识
        desc: 该参数用于指定路由器出口方向上IPv6地址族的访问控制列表（ACL）编号或者名称。
      IMPORTPREF6FILTNAME:
        name: 引入IPv6前缀过滤策略
        desc: 该参数用于指定IPv6地址族的入口前缀过滤策略。
      EXPORTPREF6FILTNAME:
        name: 发布IPv6前缀过滤策略
        desc: 该参数用于指定IPv6地址族的出口前缀过滤策略。
      ISSOURELAYNEIGHINTER:
        name: 迭代多源邻居源接口
        desc: 该参数用于指定是否迭代多源邻居源接口。多源邻居路由迭代到某个出接口后，如果此接口对应的邻居链路故障，该路由的流量仍然会从此接口流出，造成流量丢失。配置迭代多源邻居源接口可以避免此问题。
  ADD BGPVRFAF:
    name: 增加BGP VPN地址族
    func: 该命令用于添加BGP公网地址族以及BGP VPN实例地址族。BGP VPN实例下可以有多个地址族。
    params:
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用于指定VPN实例名称。
      AFTYPE:
        name: 地址族类型
        desc: 该参数用于指定BGP VPN实例下的地址族。
      ASPATHIGNORE:
        name: 忽略AS路径
        desc: 该参数用于指定在选择最优路由时是否忽略AS_PATH属性。
      MEDNONEASMAXIMUM:
        name: MED使用最大值
        desc: 该参数用于指定在选择最优路由时，如没有MED属性，则把MED按最大值来处理。
      ALWAYSCOMPAREMED:
        name: 总是比较MED
        desc: 该参数用于允许比较来自不同自治系统中邻居路由的MED值。
      DEFAULTLOCALPREF:
        name: 缺省本地优先级
        desc: 该参数用于指定该地址族下的缺省本地优先级。
      DEFAULTMED:
        name: 缺省MED
        desc: 该参数用于指定BGP路由的缺省MED值。
      DEFAULTRTIMPORTENABLE:
        name: 缺省路由引入使能
        desc: 该参数用于指定是否允许将缺省路由引入到BGP路由表中。
      MAXIMUMLOADBALANCE:
        name: 最大等价路由数
        desc: 该参数用于指定在负载分担方式下的等价路由的最大数量。
      PREFERENCEEXTERNAL:
        name: 外部路由协议优先级
        desc: 该参数用于指定EBGP路由的协议优先级。
      PREFERENCEINTERNAL:
        name: 内部路由协议优先级
        desc: 该参数用于指定IBGP路由的协议优先级。
      PREFERENCELOCAL:
        name: 本地路由协议优先级
        desc: 该参数用于指定本地路由的协议优先级。
      REFLECTBETWEENCLIENT:
        name: 客户机路由反射
        desc: 该参数用于指定是否使能客户机之间的路由反射。
      REFLECTORCLUSTERID:
        name: 路由反射器集群ID
        desc: 该参数用于指定反射器的集群ID。
      REFLECTORCLUSTERIPV4:
        name: 路由反射器集群ID(IPv4)
        desc: 该参数用于指定IPv4地址类型的反射器集群ID。
      AUTOMATICSUMMARY:
        name: 自动聚合
        desc: 该参数用于使能对本地引入的路由进行自动聚合。
      ROUTERIDNEGLECT:
        name: 忽略路由器ID
        desc: 该参数用于指定BGP在选择最优路由时是否忽略路由ID。
      IGPMETRICIGNORE:
        name: 忽略IGP Metric
        desc: 该参数用于指定BGP在选择最优路由时忽略IGP Metric的比较。
      PREFERENCEPOLICYNAME:
        name: 协议优先级策略名
        desc: 该参数用于指定路由策略，可以为满足匹配条件的从对等体收到的路由配置优先级。
      DETERMINMED:
        name: 使能Deterministic-MED
        desc: 该参数用于指定是否开启BGP deterministic-med功能，使能后在对从多个不同AS收到的相同前缀的路由进行选路时，首先会按路由的AS_Path最左边的AS号进行分组。在组内进行比较后，再用组中的优选路由和其他组中的优选路由进行比较，消除了选路的结果和路由接收顺序的相关
      EIBGPLOADBALANCE:
        name: EBGP/IBGP负载分担数
        desc: 该参数用于指定EBGP和IBGP路由负载分担的最大条数。
      EBGPIFSENSITIVE:
        name: EBGP接口快速感知
        desc: 使能后，当某个接口状态变为Down时，立即清除建立在该接口上的直连EBGP邻居的BGP会话。
      IBGPIFSENSITIVE:
        name: IBGP接口快速感知
        desc: 使能后，当某个接口状态变为Down时，立即清除建立在该接口上的直连IBGP邻居的BGP会话。
      MAXLOADEBGPNUM:
        name: EBGP负载分担数
        desc: 该参数用于指定EBGP路由参与BGP负载分担最大条数。
      MAXLOADIBGPNUM:
        name: IBGP负载分担数
        desc: 该参数用于指定IBGP路由参与BGP负载分担最大条数。
      NHPRELAYROUTEPOLICYNAME:
        name: 下一跳迭代路由策略名
        desc: 该参数用于指定下一跳迭代使用的路由策略名称。
      ECMPNEXTHOPCHANGED:
        name: 负载分担改下一跳
        desc: 该参数用于指定是否允许BGP只在发布形成负载分担的路由时才修改下一跳为自己，而在发布没有形成负载分担的路由时，不对下一跳作特殊处理。
      EIBGPEXTHOPCHANGED:
        name: EBGP/IBGP负载分担改下一跳
        desc: 该参数用于指定是否允许EBGP路由和IBGP路由只在形成负载分担的路由时才修改下一跳为自己，而在发布没有形成负载分担的路由时，不对下一跳作特殊处理。
      EBGPECMPNEXTHOPCHANGED:
        name: EBGP负载分担改下一跳
        desc: 该参数用于指定是否允许EBGP路由在形成负载分担的路由时才修改下一跳为自己，而在发布没有形成负载分担的EBGP路由时，不对下一跳作特殊处理。
      IBGPECMPNEXTHOPCHANGED:
        name: IBGP负载分担改下一跳
        desc: 该参数用于指定是否允许IBGP路由只在形成负载分担的路由时才修改下一跳为自己，而在发布没有形成负载分担的IBGP路由时，不对下一跳作特殊处理。
      REFLECTCHGPATH:
        name: 反射器应用出口策略
        desc: 该参数用于指定是否使能路由反射器通过出口策略修改BGP路由的路径属性。
      ACTIVEROUTEADVERTISE:
        name: 活跃路由通告
        desc: 该参数用于指定BGP仅发布在IP路由表中被优选的路由。
      POLICYEXTCOMMENABLE:
        name: 修改扩展团体属性
        desc: 该参数用于指定是否使能修改扩展团体属性。
      SUPERNETUNIADV:
        name: 发布超网单播路由
        desc: 该参数用于指定是否使能向BGP对等体发布BGP超网单播路由，BGP超网路由是指路由目的地址与下一跳地址相同或者路由目的地址更精确。
      ROUTERID:
        name: 路由器标识
        desc: 该参数用于指定BGP VPN实例地址族下的路由器ID。
      VRFRIDAUTOSEL:
        name: 私网BGP实例自动选择路由器ID
        desc: 该参数用于指定是否设置VPN实例自动选择Router ID。
      POLICYVPNTARGET:
        name: 是否需要过VpnTarget的策略
        desc: 该参数用于指定是否需要过VpnTarget的策略。
      NEXTHOPSELDEPENDTYPE:
        name: 下一跳迭代方式
        desc: 该参数用于指定下一跳迭代方式。
      TNLSELECTORNAME:
        name: 隧道选择器名称
        desc: 该参数用于指定隧道选择器名称。
      BESTEXTERNAL:
        name: 是否发布bestExternal路由
        desc: 该参数用于指定是否发布bestExternal路由。
      ROUTESELECTDELAY:
        name: 路由选路延迟时间
        desc: 该参数用于指定路由选路延迟时间。
      ADDPATHSELNUM:
        name: 选择add-path路由的数量
        desc: 该参数用于指定选择add-path路由的数量。
      APPLYLABELMODE:
        name: 标签分配方式
        desc: 该参数用于指定标签分配方式。
      ORIGINATORPRIOR:
        name: 选择最佳路由时，Router ID优先于CLUSTER_LIST
        desc: 该参数用于指定选择最佳路由时，Router ID是否优先于CLUSTER_LIST。
      RELAYDELAYENABLE:
        name: 迭代延迟使能
        desc: 该参数用于指定是否使能迭代延迟。
      RRFILTERNUMBER:
        name: 路由反射器组支持的扩展团体属性过滤器号
        desc: 该参数用于给定路由反射器组支持的扩展团体属性过滤器号。
      LOADASPATHIGNORE:
        name: 负载均衡忽略AS Path
        desc: 该参数用于指定路由在形成负载分担时是否不比较路由的AS-Path属性。
      MEDCONFED:
        name: 联盟内部比较MED
        desc: 该参数用于指定是否仅在联盟内比较MED值的大小。
      AUTOFRRENABLE:
        name: 自动FRR使能
        desc: 该参数用于指定是否允许自动FRR使能。
  ADD BWMRULE:
    name: 增加带宽管理规则
    func: 该命令用于增加一条用户组或用户的业务带宽管理规则。规则包括用户组级默认、特定规则和用户级默认、特定规则。当运营商希望基于用户组或用户级进行精细化带宽控制时，则使用该命令配置用户组和用户级的规则，并配置业务类型、用户属性和时间段及相应的带宽控
    params:
      USERGROUPTYPE:
        name: 用户组类型
        desc: 该参数用于配置带宽管理用户组的类型。
      USERGROUPNAME:
        name: 用户组名称
        desc: 该参数用于配置具体用户组的名称，该参数由增加带宽管理用户组定义。
      BWMRULETYPE:
        name: 带宽管理规则类型
        desc: 该参数用于配置带宽管理规则的类型。
      BWMRULENAME:
        name: 带宽管理规则名称
        desc: 该参数用于配置带宽管理规则的名称。
      BWMSERVICENAME:
        name: 带宽控制业务名称
        desc: 该参数用于配置带宽管理业务名称，该参数由增加带宽管理业务命令定义。
      RATTYPE:
        name: RAT
        desc: 该参数用于配置用户无线接入技术类型。
      ROAMINGTYPE:
        name: 漫游
        desc: 该参数用于配置用户归属的属性。
      UPBWMCTRLNAME1:
        name: 上行带宽管理控制器名称一
        desc: 该参数用于配置上行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      DNBWMCTRLNAME1:
        name: 下行带宽管理控制器名称一
        desc: 该参数用于配置下行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      TIMERANGENAME1:
        name: 时间段名称一
        desc: 该参数用于配置业务控制策略生效时段的名称，该参数由增加时间段命令定义，不配置这个参数时，该规则一直生效。
      UPBWMCTRLNAME2:
        name: 上行带宽管理控制器名称二
        desc: 该参数用于配置上行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      DNBWMCTRLNAME2:
        name: 下行带宽管理控制器名称二
        desc: 该参数用于配置下行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      TIMERANGENAME2:
        name: 时间段名称二
        desc: 该参数用于配置业务控制策略生效时段的名称，该参数由增加时间段命令定义，不配置这个参数时，该规则一直生效。
      UPBWMCTRLNAME3:
        name: 上行带宽管理控制器名称三
        desc: 该参数用于配置上行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      DNBWMCTRLNAME3:
        name: 下行带宽管理控制器名称三
        desc: 该参数用于配置下行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      TIMERANGENAME3:
        name: 时间段名称三
        desc: 该参数用于配置业务控制策略生效时段的名称，该参数由增加时间段命令定义，不配置这个参数时，该规则一直生效。
      UPBWMCTRLNAME4:
        name: 上行带宽管理控制器名称四
        desc: 该参数用于配置上行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      DNBWMCTRLNAME4:
        name: 下行带宽管理控制器名称四
        desc: 该参数用于配置下行方向带宽管理控制器的名称，该参数由增加带宽管理控制器命令定义。
      TIMERANGENAME4:
        name: 时间段名称四
        desc: 该参数用于配置业务控制策略生效时段的名称，该参数由增加时间段命令定义，不配置这个参数时，该规则一直生效。
      BWMRULEPRI:
        name: 带宽管理规则优先级
        desc: 该参数用于配置带宽管理规则的优先级，进行业务规则匹配时，优先匹配优先级高的规则，优先级的值越小，优先级越高。
      SERVICELEVEL:
        name: 业务级别
        desc: 该参数用于指定使用同一控制器的不同业务流间的优先级，值越小优先级越高。如果配置优先级，优先保证高优先级的带宽。
      CFGDOMAINNAME:
        name: 配置域名称
        desc: 该参数表示命令所属公共配置域的名称。
  ADD CPADDRPOOL:
    name: 增加地址池
    func: ''
    params:
      POOLNAME:
        name: 地址池名称
        desc: 该参数用于指定地址池的名称。
      IPVERSION:
        name: IP地址类型
        desc: 该参数用于指定IP地址类型。
      SINGLEIPFLAG:
        name: 子池类型
        desc: 该参数用于指定地址池子池类型。
      POOLTYPE:
        name: 地址池类型
        desc: 该参数用于指定地址池类型。
      CHECKIPVALID:
        name: 白名单检查开关
        desc: 该参数用于指定静态地址用户的白名单检查开关。
      HASVPN:
        name: 绑定VPN
        desc: 该参数用于指定是否绑定VPN。
      VPNINSTANCE:
        name: VPN实例名
        desc: 该参数用于指定VPN实例名称。
      IPLEASE:
        name: 地址租约使能标志
        desc: 该参数指定是否使能IP地址租约功能。
      RELEASETIME:
        name: 地址租期(秒)
        desc: 该参数指定用户释放之后，对应用户IP地址的等待释放时间。取值为0时，表示用户去激活后，其使用的本地地址将被立即释放，且可重新分配给其他用户使用。取值非0时，表示用户去激活后，其使用的地址不会立即释放，而是等待配置的时间之后才能被使用。
      IMSSW:
        name: IMS开关
        desc: 指定使能IP地址租约功能是否对IMS用户有效。
      OVERLAP:
        name: 是否允许地址重叠
        desc: 指定该地址池是全局地址池，还是局部地址池，局部地址池允许地址重叠。
      SPECIPALLOCSW:
        name: 是否分配特殊IP地址
        desc: 该参数用于指定是否分配特殊IP地址。IP地址中主机号全0或全1的IP地址是特殊IP地址。
      ALARMSW:
        name: 是否开启地址使用率的告警功能
        desc: 该参数用于指定告警“ALM-100297 地址池组使用率超阈值”是否对本地址池内IP地址使用率生效。
  ADD CPSECTION:
    name: 增加地址段
    func: ''
    params:
      POOLNAME:
        name: 地址池名称
        desc: 该参数用于指定已配置的地址池的名称。
      SECTIONNUM:
        name: 地址段号
        desc: 该参数用于指定配置Section的编号。
      IPVERSION:
        name: IP地址类型
        desc: 该参数用于指定匹配地址池的地址类型。增加的SECTION的IPVERSION参数值需要与对应的地址池所在配置ADDRPOOL中的“IPVERSION”属性保持一致。
      V4STARTIP:
        name: IPv4起始地址
        desc: 该参数用于指定IPv4地址段的起始地址。
      V4ENDIP:
        name: IPv4结束地址
        desc: 该参数用于指定IPv4地址段的结束地址。
      V6PREFIXSTART:
        name: IPv6前缀起始地址
        desc: 该参数用于指定IPv6地址段的起始前缀。
      V6PREFIXEND:
        name: IPv6前缀结束地址
        desc: 该参数用于指定IPv6地址段的终止前缀。
      V6PREFIXLENGTH:
        name: IPv6前缀长度
        desc: 该参数用于指定IPv6地址段的前缀长度。
  ADD CPURR:
    name: 增加URR
    func: 该命令用于增加使用量上报规则信息，通过该命令可以针对不同应用类型的数据采取不同的上报规则。URR即Usage Reporting Rule用量上报规则，一般对应用户报文的时长、流量等上报控制规则。URR可以通过ADD
      CPURRGROUP命
    params:
      URRNAME:
        name: 使用量上报规则名称
        desc: 该参数用于设置URR名称。
      URRID:
        name: URR标识
        desc: 该参数用于设置URR标识。
      USAGERPTMODE:
        name: 使用量上报模式
        desc: 该参数用于设置计费模式。
      OFFCOMPOUNDTYPE:
        name: 离线计费标识组成类型
        desc: 该参数用于设置离线计费标识组成类型。
      ONLCOMPOUNDTYPE:
        name: 在线计费标识组成类型
        desc: 该参数用于设置在线计费标识组成类型。
      RG:
        name: 离线计费组
        desc: 该参数用于设置离线计费组。
      SID:
        name: 离线业务标识
        desc: 该参数用于设置离线业务标识。
      UPSID:
        name: 离线上行业务标识
        desc: 该参数用于设置离线上行业务标识。
      DOWNSID:
        name: 离线下行业务标识
        desc: 该参数用于设置离线下行业务标识。
      ONLINERG:
        name: 在线计费组
        desc: 该参数用于设置在线计费组。
      ONLINESID:
        name: 在线业务标识
        desc: 该参数用于设置在线业务标识。
      OFFMETERINGTYPE:
        name: 离线计费统计类型
        desc: 该参数用于设置离线计费统计类型。
      ONLMETERINGTYPE:
        name: 在线计费统计类型
        desc: 该参数用于设置在线计费统计类型。
      TIMERSUVALUE:
        name: 时间配额值（秒）
        desc: 该参数用于设置计费方式为时长计费，并指定该计费方式与OCS/CHF交互消息中默认请求的时间配额值。
      VOLUMERSUVALUE:
        name: 流量配额值（字节）
        desc: 该参数用于设置计费方式为流量计费，并指定该计费方式在与OCS/CHF交互消息中默认请求的流量配额值。
      OFCSRVTMPLNAME:
        name: 离线业务模板名
        desc: 该参数用于设置离线计费模板名。
      REDIRENDTOKEN:
        name: Gy重定向结束Token
        desc: 该参数用于设置Gy重定向结束Token。
      MONITORINGKEY:
        name: 监控属性值
        desc: 指定监控属性值。
      EVENTRSUVALUE:
        name: 事件配额值（次）
        desc: 该参数用于设置当业务处于事件计费方式时，与OCS/CHF交互消息中默认请求的事件计费配额值。
      N40AGESW:
        name: N40接口场景下是否允许老化
        desc: 该参数用于控制N40接口计费场景，QHT或RG老化功能开启时，是否允许该URR被老化。
  ADD DHCPSERVER:
