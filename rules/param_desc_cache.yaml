        name: 使能MTU
        desc: 使能MTU。
      NETWORKTYPE:
        name: 接口网络类型
        desc: 接口网络类型。
      TIMERDEADINTV:
        name: 邻居失效的时间（s）
        desc: OSPFv3邻居失效的时间。OSPFv3邻居的失效时间是指：在该时间间隔内，若未收到邻居的Hello报文，就认为该邻居已失效。OSPFv3协议不支持NULL接口的配置。
      TIMERHELLOINTV:
        name: 发送Hello包的时间间隔（s）
        desc: 接口发送Hello报文的时间间隔。hello interval的值写入Hello报文中后随之发送。hello interval的值越小，发现网络拓扑改变的速度越快，路由开销也就越大。确定接口和邻接路由器的参数要保持一致。
          OSPFv3协议不支持NULL接口的配置。
      TIMERCONSERFLAG:
        name: 是否使能邻居失效定时器保守模式
        desc: 是否使能邻居失效定时器保守模式。使能后，即使邻居失效时间小于10s，仍按照实际配置值来判断邻居是否失效。
      TIMERRETRANINTV:
        name: 重发LSA的时间间隔（s）
        desc: 接口重传LSA的时间间隔。当一台路由器向它的邻居发送一条＂链路状态广播＂（LSA）后，需要等到对方的确认报文。若在该重传LSA的时间间隔内未收到对方的确认报文，就会重传这条LSA。
          相邻路由器重传LSA时间间隔的值不要设置得太小，否则将会引起不必要的重传。 OSPFv3协议不支持
      TIMERPOLLINTV:
        name: 发送Hello包的Poll时间间隔（s）
        desc: 发送轮询Hello报文的时间间隔。在NBMA网络上，当邻居失效后，路由器将按OSPFV3 timer poll设置的轮询时间间隔定期地发送Hello报文。轮询时间间隔值至少应为Hello报文时间间隔的4倍。
          OSPFv3协议不支持NULL接口的配置。
      TIMERWAITINTV:
        name: 超时时间（s）
        desc: 超时时间。
      CONFIGCOST:
        name: 接口开销值
        desc: 接口开销值。
      BFDENABLE:
        name: 使能BFD
        desc: 使能BFD。
      MINRXRECVINTV:
        name: 接收BFD包的最小时间间隔（ms）
        desc: 接收BFD包的最小时间间隔。
      MINTXTRANINTV:
        name: 发送BFD包的最小时间间隔（ms）
        desc: 发送BFD包的最小时间间隔。
      DETECTMULINTV:
        name: 本地检测倍数
        desc: 本地检测倍数。
      FRRBINDINGFLAG:
        name: BFD会话与接口链路状态绑定标志
        desc: 是否将BFD会话状态与接口的链路状态进行绑定。
      FRRBLOCKFLAG:
        name: 阻止指定OSPFv3接口的FRR能力
        desc: 是否阻止指定OSPFv3接口的FRR能力。
      BFDBLOCK:
        name: 阻塞接口动态创建BFD特性
