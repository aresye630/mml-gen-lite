      SESSIONNAME:
        name: 静态BFD会话名
        desc: 该参数用来指定静态路由所联动的静态BFD的会话名。为静态路由绑定静态BFD会话。通过静态BFD会话检测链路状态，为静态路由提供检测机制，可以快速感知链路变化，提高网络可靠性。
