      FRAMEDROUTE:
        name: 手机后路由
        desc: 用来配置指定APN是否允许手机后路由用户接入。
      ANTISPOOFINGDL:
        name: 下行防欺诈
        desc: 用来配置指定APN的下行数据是否支持防欺诈功能。
      ANTISPOOFINGUL:
        name: 上行防欺诈
        desc: 用来配置指定APN的上行数据是否支持防欺诈功能。
      IPTYPEFORDUALIP:
        name: 为双栈用户返回的地址类型
        desc: 指定APN在用户请求IPv4v6双栈地址时，给用户分配双栈地址还是只分配IPv4地址或者只分配IPv6地址。
      SINGLEADDRCAUSE:
        name: 分配单栈地址时返回的原因值
        desc: 指定当用户请求IPv4v6双栈地址，给用户只分配IPv4地址或者只分配IPv6地址时，激活响应消息中携带的原因值。
      CPCTRL:
        name: 基于CP分配IP地址
        desc: 指定是否开启CP控制单双栈地址分配。
      IPV6RAMTUSW:
        name: RA携带MTU选项开关
        desc: 该参数用于配置IPv6的RA消息中是否支持携带MTU选项。
      IPV6MTU:
        name: IPv6 MTU值
        desc: 该参数用于配置IPv6 MTU值。
      IPV6RALIFETIME:
        name: IPv6 RA消息路由生命周期(秒)
        desc: 该参数用于配置IPv6 RA消息路由生命周期。
      HOSTROUTEIP:
        name: 主机地址
        desc: 用于配置指定APN下是否支持CP使用主机地址接入。
      IGNOREV4POOLID:
        name: 忽略IPV4地址池名开关
        desc: 开关使能后，忽略SMF下发的IPV4地址池名字，从本地配置的地址池中分配地址。
      IGNOREV6POOLID:
        name: 忽略IPV6地址池名开关
        desc: 开关使能后，忽略SMF下发的IPV6地址池名字，从本地配置的地址池中分配地址。
  SET APNPCCFUNC:
    name: 设置APN PCC功能
    func: 此命令用于使能或关闭指定APN/DNN用户的动态PCC功能。
    params:
      APN:
        name: APN名称
        desc: 该参数用于指定APN实例名称。
      HOMEPCCSWITCH:
        name: 本地用户动态PCC功能
        desc: 该参数用于指定APN的本地用户动态PCC功能是否使能。
      ROAMPCCSWITCH:
        name: 漫游用户动态PCC功能
        desc: 该参数用于指定APN的漫游用户动态PCC功能是否使能。
      VISITPCCSWITCH:
        name: 拜访用户动态PCC功能
        desc: 该参数用于指定APN的拜访用户动态PCC功能是否使能。
      PCCTEMPLATE:
        name: PCC模板名称
        desc: 该参数用于指定APN绑定的PCC模板。
      PCFSELECTMODE:
        name: 选择PCF方式
        desc: 配置PCF的选择策略。
      DISCCUSTOM:
        name: PCF状态过滤参数
        desc: 配置标准服务发现时PCF状态过滤参数。
  SET AUTOCONFIG:
    name: 设置自动配置开关
    func: '**须知**'
    params:
      SWITCHFLAG:
        name: 自动配置开关
        desc: 该参数用于指定自动配置开关状态。
  SET CPAPNADDRESSATTR:
    name: 设置基于APN的地址分配属性
    func: ''
    params:
      APN:
        name: APN名称
        desc: 指定APN实例名。
      ANTISPOOFINGDI:
        name: 下行防欺诈
        desc: 用来配置指定APN的下行数据是否支持防欺诈功能。当使能时，下行用户报文内层源地址和目的地址相同则丢包。
      ALLOCWITHOUTPCO:
        name: 不携带PCO本地分配地址
        desc: 该参数用于配置指定APN在DHCPV4DEFER开关开启的前提下，当PCO中同时携带IPv4 address allocation via
          DHCPv4信元和IP address allocation via NAS signalling信元或者都不携带时是否给对端分配地址的属性
      ANTISPOOFINGUI:
        name: 上行防欺诈
        desc: 用来配置指定APN的上行数据是否支持防欺诈功能。当使能时，上行用户报文内层源地址和用户所分配的地址不相同则丢包。
      FRAMEDROUTE:
        name: 手机后路由
        desc: 用来配置指定APN是否允许手机后路由用户接入。
      IGNORECONFLICT:
        name: 忽略静态地址冲突
        desc: 当HLR/HSS/UDM静态签约用户携带的静态地址和RADIUS服务器返回的地址不一致时，是否忽略RADIUS服务器下发的地址，使用用户签约的静态地址激活。
      IPV4ALLOCTYPE:
        name: IPV4分配方式
        desc: 用来配置IPv4分配方式。
      IPV4RADIUSPRIOR:
        name: IPV4优先使用AAA下发地址
        desc: 该参数用于指定在“LOCAL”或“DHCP”分配方式下，如果存在AAA签约的静态IPv4地址，是否优先使用该地址。
      IPV6ALLOCTYPE:
        name: IPV6分配方式
        desc: 用来配置IPv6分配方式。
      IPV6RADIUSPRIOR:
        name: IPV6优先使用AAA下发地址
        desc: 该参数用于指定在“LOCAL”或“DHCP”分配方式下，如果存在AAA签约的静态IPv6地址，是否优先使用该地址。
      IPV6RAINTV:
        name: IPV6 RA消息发送周期(秒)
        desc: 该参数用于指定IPv6 RA消息发送的最大周期时长。UNC会在最大周期时长的3/4到最大周期期间发送RA消息。
      IPV6RAOFLAG:
        name: IPV6 RA消息O标记
        desc: 表明是否支持IPv6 RA消息O标记。
      RADIUSIPROUTE:
        name: 为Radius分配地址下发路由
        desc: 表明是否支持为Radius分配地址下发路由。
      DHCPIPROUTE:
        name: 为DHCP分配地址下发路由
        desc: 表明是否支持为DHCP分配地址下发路由。
      STATICIP:
        name: 静态地址
        desc: 用于配置指定APN下使用签约静态地址接入属性，如果参数取值为Disable，则表示禁用会话签约的静态地址。针对5G会话，该参数依赖软参Dword1052Bit27完成控制。
      STATICIPROUTE:
        name: 为静态分配地址下发路由
        desc: 该参数用于指定是否为静态分配地址下发路由。
      SUPPORTIPV4:
        name: 支持IPV4
        desc: 表明是否支持IPv4地址。
      SUPPORTIPV6:
        name: 支持IPV6
        desc: 表明是否支持IPv6地址。
      SUPPORTPRIOR:
        name: 优先支持的地址类型
        desc: 表明用户在激活时未指定请求双栈地址类型的情况下，优先返回给用户的地址类型。
      IPTYPEFORDUALIP:
        name: 为双栈用户返回的地址类型
        desc: 指定APN在用户请求IPv4v6双栈地址时，给用户分配双栈地址还是只分配IPv4地址或者只分配IPv6地址。
      SINGLEADDRCAUSE:
        name: 分配单栈地址时返回的原因值
        desc: 指定当用户请求IPv4v6双栈地址，给用户只分配IPv4地址或者只分配IPv6地址时，激活响应消息中携带的原因值。SGSN/MME会将该原因值转换成对应的NAS原因值给UE，其中前者映射的NAS原因值指示UE不再针对该APN发起另一种IP类型的PDP或PDN连接请求；而后者是允许
      IPV4ALLOCPRIALG:
        name: 基于优先级的IPV4分配算法
        desc: 该参数用于指定IPv4是否使用基于地址池优先级算法。
      IPV6ALLOCPRIALG:
        name: 基于优先级的IPV6分配算法
        desc: 该参数用于指定IPv6是否使用基于地址池优先级算法。
      RDSSVRCTRL:
        name: 基于Radius分配IP地址
        desc: 指定是否开启Radius AAA控制单双栈地址分配。
      IPV6RAMTUSW:
        name: RA携带MTU选项开关
        desc: 该参数用于配置IPv6的RA消息中是否支持携带MTU选项。
      IPV6MTU:
        name: IPv6 MTU值
        desc: 该参数用于配置IPv6 MTU值。
      IPV6RALIFETIME:
        name: IPv6 RA消息路由生命周期(秒)
        desc: 该参数用于配置IPv6 RA消息路由生命周期。
      IPV6RATIMES:
        name: IPv6路由广播次数
        desc: 该参数用于设置IPv6 PDU/PDN会话建立后，Router Advertisement发送次数。
      IPV4RDSPOOLPRI:
        name: IPV4优先使用AAA下发地址池
        desc: 该参数用于指定对IPv4地址是否优先使用AAA下发地址池。
      IPV6RDSPOOLPRI:
        name: IPV6优先使用AAA下发地址池
        desc: 该参数用于指定对IPv6地址是否优先使用AAA下发地址池。
      CONFLICTSTG:
        name: 地址冲突时去激活策略
        desc: 该参数用于指定地址冲突场景下的去激活策略。当选择的去激活策略为去激活新用户或者去激活新老用户，且新用户是双栈用户时，该新用户会先进行降栈再尝试接入。
      ALLOCPRECEDENCE:
        name: UE地址分配属性
        desc: 当IPV4ALLOCTYPE/IPV6ALLOCTYPE参数取值为Local时，本参数用于指定UE IP的分配主体是SMF还是UPF。
  SET IPALLOCBYLOCGLBSW:
    name: 设置基于位置区分配地址的全局开关
