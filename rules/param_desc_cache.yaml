  ADD OSPFV3INTERFACE:
    name: 创建OSPFv3接口配置
    func: 该命令用于在使能一个新的接口到OSPFv3进程的区域下。
    params:
      PROCID:
        name: OSPFv3进程号
        desc: OSPFv3进程号。
