  SET PCCFUNC:
    name: 设置PCC功能
    func: 此命令用于设置动态PCC功能。使能或关闭全局用户的动态PCC功能。
    params:
      HOMEPCCSWITCH:
        name: 本地用户动态PCC功能
        desc: 该参数用于是否开启本地用户动态PCC功能。
      ROAMPCCSWITCH:
        name: 漫游用户动态PCC功能
        desc: 该参数用于是否开启漫游用户动态PCC功能。
      VISITPCCSWITCH:
        name: 拜访用户动态PCC功能
        desc: 该参数用于是否开启拜访用户动态PCC功能。
      REPORTLEVEL:
        name: 缺省上报级别
        desc: 该参数用于指定PCC使能情况下的缺省上报级别。
      METERMETHOD:
        name: 缺省离线计费统计方式
        desc: 该参数用于指定PCC使能情况下的缺省离线计费统计方式。
      ARPEXTAVPSW:
        name: 承载绑定ARP扩展参数开关
        desc: 该参数用于指定是否使用参数pre-emption-capability和pre-emption-vulnerability。
      PREEMPTCAPVALUE:
        name: Pre-emption-Capability缺省值
        desc: 该参数表示一个业务数据流是否可以抢占已经分配给其他低优先级业务数据流的资源。
      PREEMPTVULVALUE:
        name: Pre-emption-Vulnerability缺省值
        desc: 该参数表示一个业务数据流是否可以被高优先级业务抢占。
      COMPOLICY:
        name: 公共策略
        desc: 该参数用于指定SMF通过R8及以上协议版本Gx接口和PCRF交互，IP-CAN-Type为3GPP-EPS时common-policy的选择原则。
      LOCSLCTMODE:
        name: PCC本端主机名选择模式
        desc: 该参数用于设置PCC本端主机名选择模式。
      LOCALHOSTNAME:
        name: 本端主机名
        desc: 该参数用于设置PCC本端主机名。
      URLCATEINTEGSW:
        name: URL分类集成开关
        desc: 该参数用来设置是否开启URL分类服务集成功能。
      QOSREQNOGXRESP:
        name: Gx接口不回复UE侧QoS请求时的处理
        desc: 该参数用于控制在UE侧发起缺省承载QoS更新或者融合网关形态下的一次上下文QoS更新，PCRF在CCA-U中未下发QoS或QoS信息不完整时，UNC是否接受请求的QoS。
      MKPARSEFORMAT:
        name: Monitoring-Key的解析方式
        desc: 该参数用于指定网元对PCRF下发的Monitoring-Key的解析方式，对PCF无效。
      LOCALPCCSELECT:
        name: 本地PCC策略选择模式
        desc: 该参数用于指定UNC本地PCC策略选择模式。
      N7FEATURELIST:
        name: N7接口特性列表
        desc: 该参数用于指定要开启的Supported-Features动态协商参数。
      PCFSELECTMODE:
        name: 选择PCF方式
        desc: 配置选择PCF时使用的参数。
      REDIRECTSWITCH:
        name: 重定向功能开关
        desc: 该参数用于是否开启重定向功能。
      N7FAILOVERSW:
        name: N7 Failover功能开关
        desc: 该参数用于指定系统是否支持N7接口failover功能。使能时，在与主PCF交互失败的情况下，SMF会执行Failover动作，将用户消息交互切换到备PCF上进行处理。
      PCFFINDREMOTESW:
        name: 远端查询PCF开关
        desc: 该参数用于指定用户在发现PCF时，除了在本地查询以外是否还支持到远端NRF进行查询，只对4G接入的用户生效。当配置为使能时，允许4G用户从远端NRF查询PCF。当配置为不使能时，不允许4G用户从远端NRF查询PCF。缺省为不使能。
      PCFLBPARA:
        name: PCF负荷分担参数
        desc: 本参数用于指定PCF负荷分担参数。
      UPFGLOCGBNDGNAME:
        name: UPF组与Diameter本端主机组的绑定关系组名称
        desc: 该参数设置UPF组与Diameter本端主机组的绑定关系组名称。
      USEN15PCFSW:
        name: 优先使用N15 PCF开关
        desc: 本参数用于指定N7优先使用N15 PCF。
      DISCCUSTOM:
        name: PCF状态过滤参数
        desc: 配置标准服务发现时PCF状态过滤参数。
  SET QOSCAR:
    name: 设置QosCar配置
    func: 该命令用于配置用户上下行QoSCar功能的全局开关。可以指定无线接入类型、漫游属性来配置用户上下行CAR功能。当使能CAR功能后，对于E-UTRAN接入的非GBR承载，系统会根据用户协商后的APN-AMBR对用户的报文发送速率做控制；对于E
    params:
      USERTYPE:
        name: 用户漫游类型
        desc: 该参数用于指定用户的漫游属性。
      ULRAT:
        name: 上行RAT类型
        desc: 该参数用于指定用户上行的接入类型。
      DLRAT:
        name: 下行RAT类型
        desc: 该参数用于指定用户下行的接入类型。
  SET QOSCTRL:
    name: 设置QoS控制配置
    func: ''
    params:
      USERTYPE:
        name: 用户漫游类型
        desc: 该参数用于指定用户的漫游属性。
      RATTYPE:
        name: RAT类型
        desc: 该参数用于指定用户的接入类型。
  SET RSFTPFIRSTTIME:
    name: 首次认证使能
    func: 该命令用于首次认证使能。
    params:
      FIRSTTIMEENABLE:
        name: 首次认证使能
        desc: 首次认证使能。
