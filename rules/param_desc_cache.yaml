        name: IP校验开关
        desc: 该参数用于指定在证书校验阶段是否校验对端IP地址。开启IP校验后，将校验对端证书中的IP地址与实际IP地址是否一致，如果不一致则HTTPS建链失败。
      VERIFYSNI:
        name: SNI校验开关
        desc: 该参数用于控制是否使用SNI验证证书中的域名。如果开启了该功能，当使用SNI匹配证书的域名失败后，建链失败。
      VDEPTH:
        name: 校验深度
        desc: 该参数用于指定校验深度。
      CIPHER:
        name: 加密套件集合
        desc: 该参数用于指定加密套件集合。
      PROTOCAL:
        name: 协议版本
        desc: 该参数用于指定协议版本。
      NESCENE:
        name: 设备证书场景
        desc: 该参数用于设备证书场景。
      CASCENE:
        name: CA证书场景
        desc: 该参数用于CA证书场景。
      DESC:
        name: 描述
        desc: 该参数用于指定TLS上下文描述。
      CRLFLAG:
        name: CRL是否开启
        desc: 该参数用于指定开启服务化接口的TLS协议时是否开启吊销证书列表。
      PSKGRPIDX:
        name: 预共享密钥组索引
        desc: 在身份认证模式为预共享密钥时，该参数用于指定关联的预共享密钥组索引。
