        desc: 该参数用于指定Eth-Trunk接口的最小激活链路数。
      LOADBALANCE:
        name: 负载分担模式
        desc: 该参数用于指定Eth-Trunk接口的负载分担模式。
  MOD VPNINSTAF:
    name: 修改L3VPN实例地址族
    func: '**须知**'
    params:
      VRFNAME:
        name: VPN实例名称
        desc: 该参数用于指定L3VPN实例名称。
      AFTYPE:
        name: 地址族类型
        desc: 该参数用于指定VPN实例下的地址族。
      VRFRD:
        name: 路由标识
        desc: 该参数用于指定用户需要修改的路由标识符。在不同VPN使用相同网段的场景下，BGP服务可以根据VRFRD区分使用相同网段的不同VPN的路由。
      IMPOLICYNAME:
        name: 引入路由策略名称
        desc: 该参数用于指定路由交叉入该VPN时的入口策略名称。
      LOCALCROSSNHPMOD:
        name: 可更改本地交叉下一跳
        desc: 该参数用于指定是否使能本地交叉修改下一跳功能。
      EXPOLICYNAME:
        name: 发布路由策略名称
        desc: 该参数用于指定路由发布时的出口策略名称。
      EXPLYADDERTFIRST:
        name: 路由上送时首先添加ERT
        desc: 该参数用于指定路由上送时是否在过策略前添加ERT。
      VRFLABELMODE:
        name: 实例的标签分配模式
        desc: 该参数用于指定VPN实例的标签分配模式。
      VRFLABEL:
        name: 实例的标签值
        desc: 该参数用于指定VPN实例的静态标签值。
      TNLPOLICYNAME:
        name: 隧道策略名称
        desc: 该参数用于指定隧道策略名称。
      FRRENABLE:
        name: FRR使能
        desc: 该参数用于指定是否允许FRR使能。
  SET APNADDRESSATTR:
