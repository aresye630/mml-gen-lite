# 配置生效的必要命令：产物里必须存在（缺了整份配置不生效）
MUST_HAVE:
  REFRESHSRV:
    verb: SET
    reason: 新增/修改 Filter、FlowFilter、FilterGroup 后必须刷新才生效
    when: 产物里出现 FILTER/FILTERIPV6/FLOWFILTER/FLTBINDFLOWF
          /FILTERGROUP/ACLRULE/ACLGROUP 任一族的 ADD/MOD/SET/RMV
    # ★ 2026-11-12 改：warn → fatal
    #   用户裁定「REFRESHSRV 是配置生效的必要命令」
    #   缺了 = 整份配置不生效 → 这是配置不合法，不是内容缺失
    severity: fatal
    wrong_verb_fatal: true
