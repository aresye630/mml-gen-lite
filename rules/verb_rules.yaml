# ═══════════════════════════════════════════════════════════════
# 动作 → MML 动词映射（★ 2026-11-14 从代码外置到 YAML）
#
# 用户偏好：「逻辑数据驱动 YAML/JSON，脚本 = 规则引擎」
# 原来这些映射硬编码在 guard/plan_vs_csv.py 和 mml_gen.py 里，
# 新增业务动作就要改代码。外置后只需改这个文件。
#
# 键 = 规划表「动作」列可能出现的中文说法
# 值 = 对应的 MML 动词
# ═══════════════════════════════════════════════════════════════
ACTION_VERB_MAP:
  # ── 配置类（改数据模型）──
  新增: ADD
  创建: ADD
  增加: ADD
  添加: ADD
  新建: ADD
  修改: MOD
  调整: MOD
  变更: MOD
  改动: MOD
  更新: UPD
  删除: RMV
  移除: RMV
  删掉: RMV
  设置: SET
  配置: SET
  # ── 操作类（改状态，不建对象）──
  激活: ACT
  去激活: DEA
  取消激活: DEA
  复位: RTR
  重启: RTR
  重置: RST
  启动: STR
  开启: STR
  使能: STR
  停止: STP
  关闭: STP
  去使能: STP
  清除: CLR
  清理: CLR
  操作: OPR
  执行: OPR
  同步: SYN
  加载: LOD
  重载: RBL
  锁定: LCK
  解锁: ULK

# ═══════════════════════════════════════════════════════════════
# 会改数据/状态的 MML 动词全集
#
# 来源：KB 的 MML 文档文件名前缀实测统计
#   add 4008  mod 2726  rmv 4200  set 3014
#   rtr 322   str 134   act 122   clr 102
#   opr 90    rst 82    stp 62    lod 46
#   syn 44    lck 44    dea 32    rbl 24
#
# 不含查询类（LST/DSP/TST/EXP）—— 只读命令不进配置产物
# ═══════════════════════════════════════════════════════════════
DATA_VERBS:
  - ADD
  - MOD
  - RMV
  - SET
  - ACT
  - DEA
  - RTR
  - RST
  - STR
  - STP
  - CLR
  - OPR
  - SYN
  - LOD
  - RBL
  - UPD
  - LCK
  - ULK

