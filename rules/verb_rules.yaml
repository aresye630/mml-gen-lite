# 配置生效的必要命令：产物里必须存在（缺了整份配置不生效）
# ★ 2026-11-12（用户裁定）
#   「REFRESHSRV 这个是配置生效的必要命令，加个规则就行了」
MUST_HAVE:
  REFRESHSRV:
    verb: SET
    reason: 新增/修改 Filter、FlowFilter、FilterGroup 后必须刷新才生效
    when: 产物里出现 FILTER/FILTERIPV6/FLOWFILTER/FLTBINDFLOWF/FILTERGROUP
          /ACLRULE/ACLGROUP 任一族的 ADD/MOD/SET/RMV
    severity: warn     # 缺失 → warn（不阻断，但提示）
    wrong_verb_fatal: true   # 动词不是 SET → fatal（如写成 ADD REFRESHSRV）
