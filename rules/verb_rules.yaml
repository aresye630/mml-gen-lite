# 命令族 → 允许的动词（数据驱动，从 EXP/GT 归纳）

# ★ 2026-11-12
#   背景：SET_FAMILIES 原来硬编码 5 个族（URRGRPBINDING/REFRESHSRV/
#        LICENSESWITCH/CFGTHRESHOLD/REFRESH），导致其余 60 个族的 SET 命令
#        被误写成 ADD。
#
#   实测（86 单 GT，65 个族有 SET 命令）：
#     · 65 个族全部【只用 SET】，没有一个混用 ADD
#     · 说明这些族是「操作类/属性设置类」，不创建对象
#
#   本文件从 GT 归纳生成，可人工增补。
#   验证方式：python3 workflow/gen_verb_rules.py --verify

