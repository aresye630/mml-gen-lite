# 意图路由规则表（P1-3）
#
# 用途：generations_v1.classify_intent() 判定入口意图类别，
#       避免寒暄/查询也建昂贵的配置生成任务（问题#5 实测：「你好」触发 gen）。
#
# 三类：
#   chat        → 走对话通道 POST /api/chat（不建任务、不占 gen 树）
#   generation  → 建配置生成任务（前端会先给一次确认）
#   （未命中任何规则）→ ambiguous：反问澄清，不建任务
#
# 匹配：按序 re.search（忽略大小写），首条命中即返回。
# 前端副本：web/app_v2.html 的 classifyIntent()（同源规则，零延迟本地判）。
# 维护：只改此文件即生效（代码有同构兜底，文件缺失不致命）。

# ── 对话/查询类（chat）──
# ⚠ 顺序敏感：chat 先判。若先把「配置」判成 generation，
#   则「媒体中继怎么配置」这类提问会被误建任务。
chat:
  # ① 寒暄 / 闲聊 / 应答（整句匹配，避免误伤含这些词的正式意图）
  - '^(你好|您好|hi|hello|hey|在吗|在不在|谢谢|多谢|好的|收到|ok|嗯|测试)[!！。.~～\s]*$'
  # ② 疑问式（问「怎么配」，不是要求「生成配置」）
  - '(怎么|如何|怎样|咋).{0,8}(配置|开通|设置|部署|实现)'
  - '(是什么|有哪些|支持吗|支持不支持|什么意思|什么含义|区别|介绍一下|解释一下|说明一下)'
  # ③ 明确提问句式
  - '^(请问|问一下|想问|咨询)'

# ── 产出类（generation）──
# 判据：明确表达「要一份产物」，而非询问方法。
generation:
  - '(生成|产出|出一份|给我一份|做一份|来一份|输出).{0,12}(配置|方案|命令|脚本|清单)?'
  - '配置开通'
  - '开通.{0,8}(业务|功能|特性)'
  - '^(配置|部署).{0,10}(方案|命令|脚本)'
