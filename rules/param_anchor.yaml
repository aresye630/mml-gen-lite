# ============================================================
# 值锚定参数（param_anchor）
#
# 有些命令的某个参数是"功能标识"——参数值代表具体功能/授权项，
# 与命令类型共同构成特性依据。exp 匹配这类命令时，参数值必须与
# 特性文档示例中的值一致（严格对应），不能只匹配命令类型。
#
# 格式：命令类型: [参数1, 参数2, ...]
#   - 单参数：该参数值必须命中文档示例值
#   - 多参数：组合锚定（AND）——各参数值均须命中文档示例值；
#     同一命令可声明多行（OR 语义，任一组命中即匹配）
# 锚定值从特性文档示例命令中自动提取（运行时），此处只声明
# "哪条命令的哪些参数是值锚定"，不写具体值（避免硬编码）。
#
# 典型：
#   SET LICENSESWITCH:LICITEM —— license 授权项 ID（LKV3G5APIG01 等），
#     exp 按授权项逐条出现，只按类型匹配会把无关授权项全部算入。
#   SET SOFTPARA:DT+BITNUM —— 软件参数 BIT 位号（如 BIT1588=1），
#     exp 中 BITNUM/BYTENUM 各不同，必须严格对应 BIT 位。
# ============================================================

SET LICENSESWITCH: [LICITEM]
SET SOFTPARA: [DT, BITNUM]

