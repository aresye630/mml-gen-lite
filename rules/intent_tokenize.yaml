# 意图分词规则（数据驱动，改规则不改代码）
#
# 用途：resolve_features() / exp_intent_fallback 的意图切词
# 原则：不硬编码业务词表；只描述「切分行为」，词本身来自意图文本与特性标题。
#
# ⚠ 背景（2026-09-16 实测缺陷）：
#   "配置VRF和接口绑定" 原实现只切出 1 个 token ⇒ 检索假零命中
#   "开通微信直播"      切出 '通微'/'信直' 等跨词噪声 ⇒ 干扰打分

version: 1

# ── ① 分隔符：直接断开
separators:
  - '，'
  - '。'
  - '、'
  - ','
  - ';'
  - '；'
  - ':'
  - '：'
  - '!'
  - '！'
  - '?'
  - '？'
  - '('
  - ')'
  - '（'
  - '）'
  - '「'
  - '」'
  - '"'
  - "'"
  - '·'
  - '/'
  - '\\'
  - '|'
  - '-'
  - '—'
  - '+'
  - '='
  - '>'
  - '<'
  - '【'
  - '】'
  - '['
  - ']'
  - '{'
  - '}'
  - "\t"
  - "\n"

# ── ② 连接词 / 停用词：断开且自身丢弃
#   这些是自然语言连接成分，不携带业务信息（泛动词同理，见 ③）
stopwords:
  - '和'
  - '与'
  - '及'
  - '以及'
  - '还有'
  - '另外'
  - '再'
  - '然后'
  - '接着'
  - '并且'
  - '或者'
  - '或'
  - '的'
  - '了'
  - '着'
  - '把'
  - '给'
  - '对'
  - '在'
  - '从'
  - '到'
  - '为'
  - '这个'
  - '那个'
  - '一个'
  - '一些'
  - '一下'
  - '怎么'
  - '如何'
  - '啥'
  - '什么'
  - '需要'
  - '想要'
  - '请'
  - '帮'
  - '我'
  - '你'
  - '它'
  - '就是'
  - '一些'
  - '相关'
  - '配置一下'
  - '加一条'
  - '加个'
  - '做个'
  - '搞个'
  - '点'

# ── ③ 泛动词（意图侧噪声源，降权而非丢弃）
#   实测：「开通」在特性库里零匹配，却会污染分词与打分
#   注意：这里只是「降权」，不是删除 —— 保留是因为某些标题确实含这些词
low_weight_verbs:
  - '开通'
  - '配置'
  - '设置'
  - '开启'
  - '关闭'
  - '修改'
  - '删除'
  - '增加'
  - '新增'
  - '调整'
  - '优化'
  - '管理'
  - '支持'
  - '实现'
  - '做'
  - '弄'
  - '搞'

# ── ④ 中英混排：英文/数字串独立成词
#   "配置VRF和接口绑定" → ['VRF', '接口', '绑定']（'配置' 被 ③ 降权但不丢）
#   "ADD L3VPNINST"     → ['ADD', 'L3VPNINST']
latin_run: '[A-Za-z][A-Za-z0-9_\-]*'
numeric_run: '[0-9]+(?:\.[0-9]+)?'

# ── ⑤ 最短保留长度（CJK）
#   中文 2 字起（1 字多为功能字）；英文/数字不限（ADD/APN/QoS 都是 3 字内）
min_cjk_len: 2
min_latin_len: 2

# ── ⑥ 业务领域词加权（可选，留空 = 纯 IDF）
#   留空表示：权重完全由 IDF + 词长 + 位置决定，不依赖人工词表
domain_boost: {}
