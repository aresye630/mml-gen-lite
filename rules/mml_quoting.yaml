# MML 参数引号（双引号）规则
#
# 用途：mml.txt 里字符串类参数值必须带双引号，否则设备会解析失败。
#       例：ADD APN:APN="cmnet"（对） vs APN=cmnet（错）
#
# 依据（2026-09-18 实测 UDG 现网 EXP）：
#   ADD APN:APN="cmnet", HASVPN=ENABLE, VPNINSTANCE="VRF_Internet", ...
#   ADD APN:APN="ims.sn.other", ... VPNINSTANCEIPV6="ChinaMobile_SGi", ...
#   统计 200 行：带引号 352 / 不带引号 481
#
# ★ 设计原则：**识别"值形态"而不是硬编码参数名白名单** ——
#   否则每遇到新参数就要改代码。判据是通用的：
#     · 值形如标识（含 . _ - 或小写字母）→ 字符串 → 加引号
#     · 值形如枚举（纯大写字母/数字/下划线）→ 不加
#     · 值形如数字/IP → 不加（但 IP 视命令而定，见 numeric_exceptions）
version: 5
updated: '2026-09-18'

# ── 判定规则（按顺序，先命中先用）──
rules:
  # ① 参数维度的强制覆盖（最高优先；少用，仅在形态判据失效时补）
  param_overrides:
    # 这些参数**永远**是字符串（即使值看起来像枚举）
    always_quote:
      - APN
      - VPNINSTANCE
      - VPNINSTANCEIPV6
      - CATEPROPNAME
      - BWMSERVICENAME
      - BWMCNAME
      - BWMRULENAME
      - USERGROUPNAME
      - FILTERNAME
      - FLOWFILTERNAME
      - L7FILTERNAME
      - HOSTNAME
      - RULENAME
      - URRNAME
      - URRGROUPNAME
      - POOLNAME
      - POOLGRPNAME
      - POOLGROUPNAME
      - MAPPINGNAME
      - USERPROFILENAME
      - PCCPOLICYGRPNM
      - PATHNAME
      - MACNAME
      - SECTIONNAME
    # 这些**永不**加引号（纯数值/布尔/枚举）
    never_quote:
      - CIR
      - CBS
      - PIR
      - PBS
      - MAXFDNUM
      - USERGROUPPRI
      - BWMRULEPRI
      - SERVICELEVEL
      - SRVLEVELSPEC
      - SECTIONNUM
      - VLANID
      - APPID

  # ② 值形态判据（无参数名可用时的通用兜底）
  value_shape:
    # 含这些字符 → 一定是字符串（域名/复合标识）
    string_chars: ['.', '-']
    # 全大写字母数字下划线组合 → 枚举/开关 → 不加
    enum_pattern: '^[A-Z][A-Z0-9_]*$'
    # 纯数字 → 不加
    numeric_pattern: '^\d+$'
    # IPv4 地址 → 当前口径不加引号（实测现网 IP 参数多数裸写）；
    #   ⚠ 若某命令要求带引号，用 param_overrides.always_quote 指名补充
    # IPv4 地址 → 当前口径不加引号（实测现网 IP 参数多数裸写）；
    #   ⚠ 若某命令要求带引号，用 param_overrides.always_quote 指名补充
    ipv4_pattern: '^\d{1,3}(\.\d{1,3}){3}$'
    # 含小写字母 → 字符串标识 → 加引号
    #   （例：cmnet / ims.sn.other / bs_wecall_2g / 139yxlj_00_r）
    lower_letters: true

# ── APN 命名生成规则（用户口径 2026-09-18）──
# 目标格式：cbiotgzqjyjgb001.gd
#   cb   = 固定前缀
#   iot  = 业务类型（物联网）
#   gz   = 地市拼音缩写（广州）
#   qjyjgb = 企业代号（用户提供或自动补全）
#   001  = 三位序号
#   .gd  = 省份拼音缩写后缀（广东）
apn_generation:
  enabled: true
  # 结构模板（拼接顺序）
  template: '{prefix}{biz}{city}{org}{seq}{province}'
  prefix: 'cb'                    # 固定前缀
  # 业务类型词表（可扩展）
  biz_types:
    iot: 物联网
    m2m: 机器通信
    nr: 新无线
  # 省市对照（拼音缩写 → 中文名）
  cities:
    gz: 广州
    sz: 深圳
    fs: 佛山
    dg: 东莞
    zh: 珠海
    st: 汕头
    gz2: 广州（备用）
  provinces:
    gd: 广东
    js: 江苏
    zj: 浙江
    sd: 山东
    bj: 北京
    sh: 上海
  # 企业代号：无法推断时自动补全的形态
  org_fallback:
    # 用「未指定」拼音缩写 + 序号，保证可辨识且不撞车
    pattern: 'wzd'                # 未指定
    # 或使用全零占位（用户口径：「自动补全或者生成一个不一样的」）
    alt_pattern: '000'
  # 序号规则
  seq:
    width: 3                      # 三位序号
    start: 1
    pad: '0'
  # 已有同族 APN 时如何起新名（避免撞车）
  dedup:
    # 沿用同省的已有 APN 的 <prefix><biz><city><province>，仅递增序号
    keep_affix: true
    seq_increment: true
