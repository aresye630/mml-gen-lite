# chain_schemas.yaml — 链级判定期望结构（UDG 12 / UNC 12 / UEG 11 链；通用模式，禁止局点实例值）
#
# 语义（与 docs/S3分析代码化改造设计.md §4.1 一致）：
#   chain_presence.anchor_cmds 全缺 → 链 not_present（本局点无此形态，不算缺口）
#   层 kind:
#     cmd_set        cmds 逐条查存在性（条目可带 param_filters：存在行中该参数=值）
#     license_items  items 为 glob（*N4UC01 匹配 LICITEM 尾号），匹配项全 ENABLE→ok、
#                    全 DISABLE→disabled、无匹配→absent（信息层）
#   absent_policy: missing(required 层缺=链缺项) | partial(可选增强层，缺了标部分) |
#                  exempt(形态豁免，缺了不算事)
#   层状态: ok / missing / partial / exempt / disabled / absent
#   verdict_rules: 顺序求值，首条 when(层状态断言) 全中 → status+note
#   equiv_substitutes: 已知等价替代（T4 差异比较器用；文档 A ↔ 现网 B 均满足→非缺口）
#
# refs（引用链，T3 扩展）：链内/跨链命令之间的参数引用关系，判定「引用闭环 vs 悬空」。
#   from: 定义方 {cmd, param}（值来源）；to: 引用方 {cmd, param|params}（值去向）
#   cmd 可为字符串 'ADD URR' 或 spec {type, filter}（含 param_filters 精准命中）
#   判定：收集 from 命令全部 param 值=定义集，to 命令 params 值=引用集（统一去 '&' 前缀）
#         引用集 ⊆ 定义集 → closed（闭环）；否则 dangling（悬空，列出悬空值）
#   cross_chain: true 仅标注该引用跨链（检测逻辑不变，commands 为全局视图）

#
# ── 多产品支持说明（2026-09-13 补充）──
#   本文件为**产品级**配置，顶层键 = 产品名（UDG/UNC/UEG）。
#   调用链按会话产品动态取键：
#     backend/app_v1.py  --product s['product']  （--chains 恒指本文件）
#     exp_analysis_code/p3_chains.py  raw.get(product, [])
#   → 某产品缺顶层键时 feature_chain_map.py 直接 KeyError，分析任务必失败。
#
#   ⚠ UNC / UEG 分组由 tools/build_chain_schemas.py **从各自 features_*.yaml 推导**：
#     数据源  /opt/expgv/rules/features_unc.yaml（609 特性）/ features_ueg.yaml（1294 特性）
#     方法    命令 → 名词族 → 按族统计关联特性数 → 组合成业务链；
#             anchor = 该族中最独特的 ADD 命令；层按出现频次（≥3 特性 = required）
#     覆盖    UNC 12 链 / 272 特性，UEG 11 链 / 502 特性
#     验证    离线：真实样本锚点命中 UNC 7/12、UEG 5/11（未命中=样本确实没配该功能，
#             正确行为）；实测：UNC/UEG 样本分析→匹配→生成全链路跑通，产物形态与 UDG 一致
#   ⚠ 推导产物，建议人工校核后再作为长期基准。
# 变更 2026-09-13：新增 UNC/UEG 分组（推导生成，源 features_unc/ueg.yaml）
#   方法见 tools/build_chain_schemas.py（规则外置 CHAIN_RULES）
#   覆盖：UNC 334/609 (55%)、UEG 600/1294 (46%)

UDG:
- chain_id: A
  name: VRF/接口/路由
  anchor_cmds:
  - ADD L3VPNINST
  anchor_param: VRFNAME
  layers:
  - id: INST
    name: VRF 实例
    cmds:
    - ADD L3VPNINST
    required: true
  - id: AF
    name: 地址族
    cmds:
    - ADD VPNINSTAF
    - MOD VPNINSTAF
    required: true
  - id: RD
    name: 路由区分符
    cmds:
    - MOD L3VPNINST
    required: true
  - id: BIND
    name: 接口绑定
    cmds:
    - ADD IPBINDVPN
    required: true
  - id: IFADDR
    name: 接口地址
    cmds:
    - ADD IFIPV4ADDRESS
    - ADD IFIPV6ADDRESS
    required: true
  - id: HOSTRT
    name: 主机路由
    cmds:
    - ADD SRROUTE
    required: true
  - id: BFD
    name: BFD 探测
    cmds:
    - ADD BFDSESSION
    required: true
  - id: HOSTRT6
    name: IPv6 主机路由
    cmds:
    - ADD SRROUTE6
    required: false
    absent_policy: partial
  - id: IMPORT
    name: 路由引入
    cmds:
    - ADD IMPORTROUTE
    required: false
    absent_policy: partial
  - id: AGGRT
    name: 聚合路由
    cmds:
    - ADD AGGREGATEROUTE
    required: false
    absent_policy: partial
  - id: BGP
    name: BGP 邻居/地址族
    cmds:
    - ADD BGPVRF
    - ADD BGPPEER
    - ADD BGPVRFAF
    - MOD BGPVRFAF
    - MOD BGPPEERAF
    required: false
    absent_policy: partial
  - id: VPNINST
    name: VPN 实例
    cmds:
    - ADD VPNINST
    required: false
    absent_policy: partial
  - id: EPRP
    name: EPRP 路由策略
    cmds:
    - ADD EPRPSTA
    - ADD EPRPDYNIP
    - ADD EPRPDYN
    required: false
    absent_policy: partial
  - id: SCALE
    name: 弹性伸缩
    cmds:
    - ADD AUTOSCALINGSERVICE
    - ADD AUTOSCALINGSRROUTE
    - ADD AUTOSCALINGBFD
    required: false
    absent_policy: partial
  verdict_rules:
  - when:
      INST: ok
      AF: ok
      RD: ok
      BIND: ok
      IFADDR: ok
      HOSTRT: ok
      BFD: ok
    status: ok
    note: VRF/接口/路由链完整
  - when: {}
    status: partial
    note: 部分落地（见层明细）
  equiv_substitutes: []
  refs:
  - name: VRF→接口绑定
    from:
      cmd: ADD L3VPNINST
      param: VRFNAME
    to:
      cmd: ADD IPBINDVPN
      param: VRFNAME
  - name: VRF→主机路由
    from:
      cmd: ADD L3VPNINST
      param: VRFNAME
    to:
      cmd: ADD SRROUTE
      param: VRFNAME
  - name: VRF→IPv6主机路由
    from:
      cmd: ADD L3VPNINST
      param: VRFNAME
    to:
      cmd: ADD SRROUTE6
      param: VRFNAME
  - name: VRF→路由引入
    from:
      cmd: ADD L3VPNINST
      param: VRFNAME
    to:
      cmd: ADD IMPORTROUTE
      param: VRFNAME
  - name: VRF→BGP地址族
    from:
      cmd: ADD L3VPNINST
      param: VRFNAME
    to:
      cmd: ADD BGPVRFAF
      param: VRFNAME
- chain_id: B
  name: APN×位置×SMF 本地地址池
  anchor_cmds:
  - ADD POOL
  anchor_param: POOLNAME
  layers:
  - id: L1
    name: 池与地址段
    cmds:
    - ADD POOL
    - ADD SECTION
    required: true
  - id: L2
    name: 组与绑定
    cmds:
    - ADD POOLGROUP
    - ADD POOLBINDGROUP
    required: true
  - id: L3
    name: 位置区 TAC
    cmds:
    - ADD TACGROUP
    - ADD N2TACID
    - ADD S1TACID
    required: true
  - id: L4
    name: APN 定义
    cmds:
    - ADD APN
    required: true
  - id: L5
    name: APN×位置映射
    cmds:
    - ADD POOLGRPMAP
    required: true
  - id: L6
    name: 分配规则与开关
    cmds:
    - SET IPALLOCRULE
    - SET APNIPALLOCRULE
    - SET IPALLOCBYLOCGLBSW
    - SET IPALLOCBYLOCSW
    - SET IPALLOCBYSMFSW
    required: true
  - id: L7
    name: APN 地址属性
    cmds:
    - SET APNADDRESSATTR
    - SET APNIMSATTR
    - SET APNQOSATTR
    required: false
    absent_policy: partial
  - id: L8
    name: APN 附属开关
    cmds:
    - SET APNAFFUNC
    - SET APNUEMUTACC
    - SET APNDDNFLOWCTRL
    - SET APNCFFUNC
    - SET APNTETHERFUNC
    - SET APNSRVSTATFUNC
    required: false
    absent_policy: partial
  verdict_rules:
  - when:
      L1: ok
      L2: ok
      L3: ok
      L4: ok
      L5: ok
      L6: ok
    status: ok
    note: 文档步骤全落地
  - when: {}
    status: partial
    note: 部分落地（见层明细）
  equiv_substitutes:
  - doc_cmds:
    - ADD OSPFAREA
    - ADD OSPFIMPORTROUTE
    exp_cmds:
    - ADD SRROUTE
    - ADD BFDSESSION
    note: 下行路由部署选型差异（静态+BFD vs OSPF），非缺口
  refs:
  - name: POOL→地址段
    from:
      cmd: ADD POOL
      param: POOLNAME
    to:
      cmd: ADD SECTION
      param: POOLNAME
  - name: POOL→绑定组
    from:
      cmd: ADD POOL
      param: POOLNAME
    to:
      cmd: ADD POOLBINDGROUP
      param: POOLNAME
  - name: POOLGROUP→绑定组
    from:
      cmd: ADD POOLGROUP
      param: POOLGRPNAME
    to:
      cmd: ADD POOLBINDGROUP
      param: POOLGROUPNAME
  - name: POOLGROUP→APN映射
    from:
      cmd: ADD POOLGROUP
      param: POOLGRPNAME
    to:
      cmd: ADD POOLGRPMAP
      param: POOLGROUPNAME
  - name: APN→APN映射
    from:
      cmd: ADD APN
      param: APN
    to:
      cmd: ADD POOLGRPMAP
      param: APN
  - name: APN→VRF实例
    from:
      cmd: ADD L3VPNINST
      param: VRFNAME
    to:
      cmd: ADD APN
      params:
      - VPNINSTANCE
      - VPNINSTANCEIPV6
    cross_chain: true
- chain_id: C
  name: 数据面过滤（L34/L7）
  anchor_cmds:
  - ADD FILTER
  - ADD FLOWFILTER
  anchor_param: FLOWFILTERNAME
  layers:
  - id: L34
    name: L3/L4 规则
    cmds:
    - ADD FILTER
    - ADD FILTERIPV6
    required: true
  - id: FLOW
    name: 流过滤器
    cmds:
    - ADD FLOWFILTER
    required: true
  - id: BRIDGE
    name: 显式桥接绑定
    cmds:
    - ADD FLTBINDFLOWF
    required: true
  - id: DOMAIN
    name: 域名/HOST 解析层
    cmds:
    - ADD HOST
    - ADD L7FILTER
    required: false
    absent_policy: partial
  - id: PROTO
    name: 协议绑定层
    cmds:
    - ADD PROTBINDFLOWF
    required: false
    absent_policy: partial
  - id: REFRESH
    name: 生效刷新
    cmds:
    - SET REFRESHSRV
    required: false
    absent_policy: partial
  verdict_rules:
  - when:
      L34: ok
      FLOW: ok
      BRIDGE: ok
    status: ok
    note: L34→FLOWFILTER→桥接完整
  - when: {}
    status: missing
    note: 核心过滤层缺项
  equiv_substitutes: []
  refs:
  - name: FLOWFILTER→桥接绑定
    from:
      cmd: ADD FLOWFILTER
      param: FLOWFILTERNAME
    to:
      cmd: ADD FLTBINDFLOWF
      param: FLOWFILTERNAME
  - name: FILTER→桥接绑定
    from:
      cmd:
      - ADD FILTER
      - ADD FILTERIPV6
      param: FILTERNAME
    to:
      cmd: ADD FLTBINDFLOWF
      param: FILTERNAME
  - name: FLOWFILTER→协议绑定
    from:
      cmd: ADD FLOWFILTER
      param: FLOWFILTERNAME
    to:
      cmd: ADD PROTBINDFLOWF
      param: FLOWFILTERNAME
  - name: L7FILTER→协议绑定
    from:
      cmd: ADD L7FILTER
      param: L7FILTERNAME
    to:
      cmd: ADD PROTBINDFLOWF
      param: L7FILTERNAME
- chain_id: D
  name: PCC 计费策略
  anchor_cmds:
  - ADD URRGROUP
  - ADD URR
  anchor_param: URRGROUPNAME
  anchor_param_exclude_prefix: '&'
  layers:
  - id: URR
    name: 计量记录
    cmds:
    - ADD URR
    required: true
  - id: GRP
    name: 计费组
    cmds:
    - ADD URRGROUP
    required: true
  - id: PCC
    name: 策略组
    cmds:
    - ADD PCCPOLICYGRP
    required: true
  - id: RULE
    name: 规则
    cmds:
    - ADD RULE
    required: true
  - id: BIND
    name: 规则绑定用户模板
    cmds:
    - ADD RULEBINDING
    - ADD USERPROFILE
    required: true
  - id: GBIND
    name: 缺省组绑定
    cmds:
    - SET URRGRPBINDING
    required: true
  - id: SPEC
    name: 专组清单
    cmds:
    - ADD SPECURRGRPLIST
    required: false
    absent_policy: partial
  - id: ACT
    name: 动作/失效处理
    cmds:
    - ADD PCCACTIONPROP
    - SET URRFAILACTION
    - SET SPECTRAFURRGRP
    - SET UPURRCTRL
    - SET PCCRULECTRL
    required: false
    absent_policy: partial
  verdict_rules:
  - when:
      URR: ok
      GRP: ok
      PCC: ok
      RULE: ok
      BIND: ok
      GBIND: ok
    status: ok
    note: PCC 链完整
  - when: {}
    status: missing
    note: PCC 链缺项
  equiv_substitutes:
  - doc_params:
    - cmd: ADD PCCPOLICYGRP
      param: SIGURRGRPNAME
    exp_cmds:
    - SET URRGRPBINDING
    note: 信令组由 URRGRPBINDING 缺省承担，结构等价替代非缺口
  refs:
  - name: URR→计费组
    from:
      cmd: ADD URR
      param: URRNAME
    to:
      cmd: ADD URRGROUP
      params:
      - UPURRNAME1
      - DOWNURRNAME1
      - UPURRNAME2
      - DOWNURRNAME2
  - name: 计费组→策略组
    from:
      cmd: ADD URRGROUP
      param: URRGROUPNAME
    to:
      cmd: ADD PCCPOLICYGRP
      param: URRGROUPNAME
  - name: 策略组→规则
    from:
      cmd: ADD PCCPOLICYGRP
      param: PCCPOLICYGRPNM
    to:
      cmd:
        type: ADD RULE
        filter:
          POLICYTYPE: PCC
      param: POLICYNAME
  - name: 规则→规则绑定
    from:
      cmd:
        type: ADD RULE
        filter:
          POLICYTYPE: PCC
      param: RULENAME
    to:
      cmd:
        type: ADD RULEBINDING
        filter:
          POLICYTYPE: PCC
      param: RULENAME
  - name: 计费组→缺省组绑定
    from:
      cmd: ADD URRGROUP
      param: URRGROUPNAME
    to:
      cmd: SET URRGRPBINDING
      params:
      - DFTURRGRPNAME
      - DFTSIGURRGNAME
- chain_id: E
  name: SuperE5 QOS 直播加速
  anchor_cmds:
  - type: ADD URR
    filter:
      USAGERPTMODE: QOS
  anchor_param: URRNAME
  anchor_param_require_prefix: supere5_
  layers:
  - id: FLOW
    name: 直播流过滤器
    cmds:
    - ADD FLOWFILTER
    required: true
  - id: PROTO
    name: 直播协议绑定
    cmds:
    - ADD PROTBINDFLOWF
    required: true
  - id: URRQ
    name: QOS 计量
    cmds:
    - type: ADD URR
      filter:
        USAGERPTMODE: QOS
    required: true
  - id: QPROP
    name: QOS 属性
    cmds:
    - ADD QOSPROP
    required: true
  - id: RULEQ
    name: QOS 规则
    cmds:
    - type: ADD RULE
      filter:
        POLICYTYPE: QOS
    required: true
  - id: BINDQ
    name: QOS 绑定
    cmds:
    - type: ADD RULEBINDING
      filter:
        POLICYTYPE: QOS
    required: true
  verdict_rules:
  - when:
      FLOW: ok
      PROTO: ok
      URRQ: ok
      QPROP: ok
      RULEQ: ok
      BINDQ: ok
    status: ok
    note: QOS 链完整
  - when: {}
    status: partial
    note: QOS 链部分落地（见层明细）
  equiv_substitutes: []
  refs:
  - name: URR→QOS属性
    from:
      cmd: ADD URR
      param: URRNAME
    to:
      cmd: ADD QOSPROP
      param: QOSURRNAME
  - name: QOS属性→规则
    from:
      cmd: ADD QOSPROP
      param: QOSPROPNAME
    to:
      cmd:
        type: ADD RULE
        filter:
          POLICYTYPE: QOS
      param: POLICYNAME
  - name: 规则→规则绑定
    from:
      cmd:
        type: ADD RULE
        filter:
          POLICYTYPE: QOS
      param: RULENAME
    to:
      cmd:
        type: ADD RULEBINDING
        filter:
          POLICYTYPE: QOS
      param: RULENAME
- chain_id: F
  name: SSU/QoE 智能保障
  anchor_cmds:
  - ADD SSUPROTCOLGROUP
  anchor_param: POLICYCNDNAME
  layers:
  - id: COND
    name: 策略条件
    cmds:
    - ADD POLICYCONDITION
    required: true
  - id: PROTGRP
    name: 协议组
    cmds:
    - ADD SSUPROTCOLGROUP
    required: true
  - id: APPCTRL
    name: 应用策略控制
    cmds:
    - ADD APPPOLICYCTRL
    required: true
  - id: SWITCH
    name: 推理开关
    cmds:
    - SET QOEBASICFUNC
    - SET VVIPBASICFUNC
    required: true
    param_observations:
    - cmds:
      - SET QOEBASICFUNC
      params:
      - QOESWITCH
      why: QoE 推理开关（QOESWITCH=DISABLE 时对象已建但推理未启；开启需许可与 CoreMind/IISA 服务就绪）
  - id: CATEGORY
    name: 内容分类
    cmds:
    - ADD CATEGORYPROP
    required: false
    absent_policy: partial
  - id: IISA
    name: IISA 模型
    cmds:
    - SET IISABASICFUNC
    - SET IISAMODELMONIT
    - SET MODELGLBFUNC
    required: false
    absent_policy: partial
  - id: PERF
    name: 应用性能统计
    cmds:
    - ADD APPPERFSTAT
    required: false
    absent_policy: partial
  verdict_rules:
  - when:
      COND: ok
      PROTGRP: ok
      APPCTRL: ok
      SWITCH: ok
    status: ok
    note: QoE 对象面完整
  - when: {}
    status: partial
    note: QoE 对象面部分（见层明细）
  equiv_substitutes: []
  refs:
  - name: 策略条件→协议组
    from:
      cmd: ADD POLICYCONDITION
      param: POLICYCNDNAME
    to:
      cmd: ADD SSUPROTCOLGROUP
      param: POLICYCNDNAME
  - name: 协议组→应用策略
    from:
      cmd: ADD SSUPROTCOLGROUP
      param: DEFPRTGRPNAME
    to:
      cmd: ADD APPPOLICYCTRL
      param: DEFPRTGRPNAME
- chain_id: G
  name: N4/N6 路径管理/故障联动
  anchor_cmds:
  - SET UPPFCPPATH
  - SET UPN4UPATH
  - SET UPGTPPATH
  layers:
  - id: L4
    name: 许可授权
    kind: license_items
    items:
    - LKV3G5N4UC01
    - LKV3G5N6FL01
    - LKV3G5N3FL01
    required: false
    absent_policy: exempt
  - id: L3
    name: 协议层（Echo/心跳+去活）
    cmds:
    - SET UPPFCPPATH
    - SET UPN4UPATH
    - SET UPGTPPATH
    required: true
    param_observations:
    - cmds:
      - SET UPGTPPATH
      params:
      - V1DATAECHOSW
      - V0ECHOSW
      - T3RESPONSE
      why: Echo/T3 现网值偏激进且依赖对端探测（参考常见 V1DATAECHOSW=ENABLE）；需与对端(R)AN/SMF 确认 N3/N6 GTP-U 保活
    - cmds:
      - SET UPGTPPATH
      - SET UPN4UPATH
      - SET UPPFCPPATH
      params:
      - DEACTIVEFLAG
      why: DEACTIVEFLAG=ENABLE 时路径断后去活路径上全部上下文（业务闪断级）；三层全 ENABLE 属激进策略需与 SMF 联动确认
  - id: L2
    name: APN 级自定义探测
    cmds:
    - ADD LOGICINF
    - ADD DETECTPATH
    - ADD APNBINDPATH
    - SET APNTNLSTATUSRPT
    required: false
    absent_policy: partial
  - id: L1
    name: GRE 隧道形态
    cmds:
    - ADD GRETUNNEL
    required: false
    absent_policy: exempt
  verdict_rules:
  - when:
      L3: missing
    status: missing
    note: 协议层缺项
  - when:
      L3: ok
      L2: partial
    status: partial
    note: L3 协议层完整/L2 APN 级探测未启用
  - when:
      L3: ok
    status: ok
    note: 路径管理层完整
  equiv_substitutes: []
- chain_id: H
  name: 保护/杂项（ACL/IPFARM/头增强）
  anchor_cmds:
  - ADD IPFARM
  anchor_param: IPFARMNAME
  layers:
  - id: ACL
    name: ACL 保护
    cmds:
    - ADD ACL
    - ADD ACLBINDAPN
    - ADD ACLNODE
    - ADD ACLNODEBINDACL
    required: true
  - id: IPFARM
    name: 业务保护实例
    cmds:
    - ADD IPFARM
    - ADD IPFARMSERVER
