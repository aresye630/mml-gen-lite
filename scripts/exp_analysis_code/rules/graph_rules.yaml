# graph_rules.yaml — 全量引用图构建参数（数据驱动，改配置不改码）
#
# 背景（2026-09-15 修 OOM）：
#   graph_build.build_graph 对每个对象名值 v 建 len(definers)×len(referers) 条边。
#   多数值只有个位数，但枚举/占位符类值（如 SPECIFICATION_LIMITED：
#   8,640 定义方 × 3,063 引用方 = 2,646 万条边，占全图 99.6%）会瞬间吃掉 >7 GiB
#   触发 OOM-killer（12.9MB UNC 样本实测峰值 7.40 GiB，rc=-9）。
#
#   这类值不是真实对象实例，两两连边既无意义又必然爆内存。
#   本参数限制单值扇出，同时保持连通性（未入样的节点各连 1 条到对方代表节点），
#   确保 feature_find 的 BFS 扩展仍能跨过该值、不漏配。
#
# 调参指引：
#   - 太小 → 巨型团内边被过度削减，图上"顺藤摸瓜"能走到的范围变窄
#   - 太大 → 内存回升（经验：单值边数上界 ≈ fanout_limit，全图内存 ≈
#            各级值边数总和 × 约 300B/边）
#   - 20000 对应 12.9MB UNC 样本峰值从 7.40 GiB 降到 <1 GiB，BFS 覆盖不失真

graph:
  # 单值「定义方 × 引用方」边数上限。超过则抽样代表节点 + 保连通补边。
  # 0 = 不限制（旧行为，仅用于对照/诊断）
  fanout_limit: 20000
